/* ===================== Recall design system (rules in CLAUDE.md) =====================
   One sans (the system font), one accent (gold) for the primary action, focus and progress,
   colour only where it carries meaning (ratings, mistake/solution), hairlines instead of boxes,
   three radii, short purposeful motion. Everything below overrides the older layers above. */
:root{
  --r-sm:6px; --r-md:10px; --r-lg:12px;
  --ease:cubic-bezier(.2,.7,.2,1); --t-fast:.12s; --t-med:.18s; --t-slow:.28s;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html.lh body{font-family:var(--ui);font-size:14px;line-height:1.5;background-image:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html.lh body.desktop .page,html.lh .page{background-image:none}
html.lh :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
html.lh h1,html.lh h2,html.lh h3{letter-spacing:-.01em}
.num,.n,.ct,.dc,.tdue,.dd,.lhstat,.lhstatus,.statrow b,.bar b,.hrow b{font-variant-numeric:tabular-nums}

/* keyboard hints */
kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border:1px solid var(--border-2);border-radius:4px;font:500 11px/1 var(--mono);color:var(--fg-3);background:transparent}
.btn kbd{margin-left:8px}
.btn.primary kbd{border-color:color-mix(in srgb, var(--btn-fg) 28%, transparent);color:color-mix(in srgb, var(--btn-fg) 70%, transparent)}

/* ---------- controls ---------- */
html.lh .btn{height:30px;padding:0 12px;border-radius:var(--r-sm);font:500 13px/1 var(--ui);letter-spacing:0;background:var(--surface-2);border:1px solid var(--border-2);color:var(--fg);box-shadow:none;transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast)}
html.lh .btn:hover:not(:disabled){background:var(--hover)}
html.lh .btn:active:not(:disabled){transform:translateY(.5px)}
html.lh .btn.sm{height:26px;padding:0 10px;font-size:12px}
html.lh .btn.big{height:36px;padding:0 16px;font-size:14px;border-radius:var(--r-sm)}
html.lh .btn.primary{background:var(--accent-btn);border-color:transparent;color:var(--btn-fg);font-weight:600}
html.lh .btn.primary:hover:not(:disabled){background:color-mix(in srgb, var(--accent-btn) 88%, var(--fg-hi))}
html.lh .btn.tint{background:var(--surface-2);border-color:var(--border-2);color:var(--fg);font-weight:500}
html.lh .btn.danger{color:var(--again);border-color:var(--border-2)}
html.lh .btn.idk{border-style:solid;background:transparent}
html.lh .link{font:500 13px var(--ui);color:var(--fg-2);border-radius:var(--r-sm)}
html.lh .link.sm{font-size:12px}
html.lh .icon{border-radius:var(--r-sm)}
.danger-link{color:color-mix(in srgb, var(--again) 80%, var(--fg-2)) !important}
html.lh .in{border-radius:var(--r-sm);background:var(--inset);border-color:var(--border-2)}
html.lh .in:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 16%, transparent)}
html.lh .in:focus-visible{outline:none}
html.lh .drop{border-radius:var(--r-sm)}
html.lh .drop.active{border-color:var(--fg-3)}
html.lh .seg button{border-radius:var(--r-sm);font:500 13px var(--ui);background:transparent;color:var(--fg-2)}
html.lh .seg button:hover{color:var(--fg);background:var(--hover)}
html.lh .seg button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
html.lh .fchip{border-radius:var(--r-sm);font:500 12px var(--ui);background:transparent}
html.lh .fchip[aria-pressed="true"]:not([class*=" r"]){border-color:var(--fg-2);background:var(--hover);color:var(--fg)}
html.lh .pill{border-radius:4px;font:600 11px var(--ui);border-color:var(--border-2);color:var(--fg-2)}
.again-pill{color:var(--again) !important;border-color:color-mix(in srgb, var(--again) 40%, transparent) !important}
html.lh .chip,html.lh .alsochip,html.lh .revchips span{border-radius:var(--r-sm)}
html.lh .leechtag{font:600 11px var(--ui);border-radius:4px;padding:1px 6px}
html.lh .ltag,html.lh .pkb,html.lh .rtag{border-radius:4px}

/* labels: sentence case, quiet, never shouted */
html.lh .lbl,html.lh .field>label{font:600 12px var(--ui);color:var(--fg-2);letter-spacing:0}
html.lh .lbl span,html.lh .field>label span{font-weight:400;color:var(--fg-3)}
html.lh .sub{font-size:13px;color:var(--fg-3)}
html.lh .btable th{font:600 12px var(--ui);color:var(--fg-3);letter-spacing:0}

/* ---------- surfaces ---------- */
html.lh .panel{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:16px 18px}
html.lh .panel h2{font:600 14px var(--ui);color:var(--fg);letter-spacing:0;margin:0 0 12px}
html.lh .children h2{font:600 13px var(--ui);color:var(--fg-2);margin:0 0 8px}
html.lh .menu{border-radius:var(--r-md);padding:4px;background:var(--surface-2);box-shadow:0 12px 32px rgba(0,0,0,.35)}
html.lh .menu button{border-radius:var(--r-sm);font-size:13px}
html.lh .menu button:hover{background:var(--hover)}
html.lh .dialog{border-radius:var(--r-lg);border-color:var(--border-2);box-shadow:0 24px 60px rgba(0,0,0,.45)}
html.lh .dialog > header{border-radius:var(--r-lg) var(--r-lg) 0 0}
html.lh .dialog > footer{border-radius:0 0 var(--r-lg) var(--r-lg)}
html.lh .dialog header h2{font:600 16px var(--ui);letter-spacing:-.01em}
html.lh .toast{font:500 13px var(--ui);border-radius:var(--r-md);animation:toastin var(--t-med) var(--ease) both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
html.lh .banner{border-radius:var(--r-md);background:var(--surface);border-color:var(--border-2);color:var(--fg-2)}
html.lh .thcard{border-width:1px;border-radius:var(--r-md)}
html.lh .thcard[aria-pressed="true"]{border-color:var(--fg-2);box-shadow:0 0 0 1px var(--fg-2)}
html.lh .fcard{border-width:1px;border-radius:var(--r-md)}
html.lh .fcard[aria-pressed="true"]{border-color:var(--fg-2);background:var(--hover);box-shadow:0 0 0 1px var(--fg-2)}
html.lh .sideitem[aria-current="true"]{background:rgba(var(--ovr),.08)}
html.lh .rtebar button[aria-pressed="true"]{background:var(--hover)}

/* ---------- sidebar (Mac, Windows, iPad landscape) ---------- */
html.lh body.desktop .toolbar{font-family:var(--ui);padding:52px 10px 14px}
html.lh body.desktop .toolbar .tin{gap:1px}
html.lh body.desktop .brand{order:0;gap:9px;padding:0 8px 14px;font-family:var(--ui)}
html.lh .brand .logo,html.lh body.desktop .brand .logo{width:24px;height:24px;border-radius:6px}
html.lh .brand .wordmark,html.lh body.desktop .brand .wordmark{font:600 15px/1 var(--ui);letter-spacing:-.01em}
html.lh body.desktop .sideadd{order:1;display:flex;align-items:center;gap:8px;margin:0 0 12px;width:100%;height:30px;padding:0 8px 0 10px;justify-content:flex-start;background:var(--surface-2);color:var(--fg);border:1px solid var(--border-2);border-radius:var(--r-sm);font:500 13px var(--ui);letter-spacing:0;box-shadow:none}
html.lh body.desktop .sideadd svg{width:14px;height:14px;color:var(--fg-2)}
html.lh body.desktop .sideadd kbd{margin-left:auto}
html.lh body.desktop .sideadd:hover{background:var(--hover)}
html.lh body.desktop .toolbar nav{order:2;gap:1px}
html.lh body.desktop .sidesearch{order:3;margin:12px 0 0;border-radius:var(--r-sm);height:30px;padding:0 9px}
html.lh body.desktop .sidesres{order:4}
html.lh body.desktop .sidesubs{order:5;margin-top:18px;gap:1px}
html.lh body.desktop .cloudpill{order:6;margin-top:auto;border-radius:var(--r-sm);font:500 12px var(--ui);letter-spacing:0;justify-content:flex-start;padding:7px 10px}
html.lh body.desktop .toolbar nav button{height:28px;padding:0 8px;gap:9px;font:500 13px var(--ui);letter-spacing:0;color:var(--fg-2);border-radius:var(--r-sm);background:none;box-shadow:none}
html.lh body.desktop .toolbar nav button .ni{width:16px;height:16px;color:var(--fg-3)}
html.lh body.desktop .toolbar nav button:hover{background:rgba(var(--ovr),.05);color:var(--fg)}
html.lh body.desktop .toolbar nav button[aria-current="true"]{background:rgba(var(--ovr),.08);color:var(--fg);box-shadow:none}
html.lh body.desktop .toolbar nav button[aria-current="true"] .ni{color:var(--accent)}
html.lh .sidelabel,html.lh body.desktop .sidelabel{font:600 11px var(--ui);letter-spacing:0;color:var(--fg-3);padding:0 8px 4px}
html.lh .sideclr{font:500 11px var(--ui);letter-spacing:0}
html.lh body.desktop .toolbar .sidesub{height:28px;padding:0 8px;gap:9px;font:500 13px var(--ui);letter-spacing:0;border:0;border-radius:var(--r-sm);color:var(--fg-2);background:none}
html.lh body.desktop .toolbar .sidesub .nm{font-weight:500}
html.lh body.desktop .toolbar .sidesub .dot{width:7px;height:7px;box-shadow:none}
html.lh body.desktop .toolbar .sidesub .ct{font:500 12px var(--ui);background:none;color:var(--fg-3);padding:0;min-width:0}
html.lh body.desktop .toolbar .sidesub:hover{background:rgba(var(--ovr),.05);color:var(--fg)}
html.lh body.desktop .toolbar .sidesub[aria-current="true"]{background:rgba(var(--ovr),.08);color:var(--fg)}
html.lh body.desktop .toolbar .sidesub[aria-current="true"] .ct{background:none;color:var(--fg-2)}
html.lh .siderec{border-radius:var(--r-sm);padding:6px 8px}
html.lh .siderec .nm{font-size:13px}
html.lh .siderec .meta{font:400 12px var(--ui)}

/* top bar on phones and narrow windows */
html.lh body:not(.desktop) .toolbar nav button{font:500 13px var(--ui);letter-spacing:0;border-radius:var(--r-sm);padding:6px 10px}
html.lh body:not(.desktop) .toolbar nav button[aria-current="true"]{background:rgba(var(--ovr),.08);box-shadow:none}
html.lh body:not(.desktop) .brand .wordmark{font-size:16px}

/* ---------- home ---------- */
.htop{align-items:flex-end}
.htitle{margin:0;font:600 22px/1.2 var(--ui);letter-spacing:-.015em;color:var(--fg)}
.hsub{margin:4px 0 0;font-size:13px;color:var(--fg-3)}
.hsub b{color:var(--accent);font-weight:600}
html.lh .subj{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px 10px}
.subjgrid.free .subj{box-shadow:none}
.subj.dragging{box-shadow:0 18px 48px rgba(0,0,0,.35) !important}
html.lh .shd{gap:10px;align-items:center;min-height:32px}
.sdotl{width:8px;height:8px;border-radius:50%;background:var(--sc);flex:none;margin:0 2px}
.semj{font-size:16px;line-height:1;flex:none}
.sh2{border:0;background:none;padding:0;text-align:left;font:600 16px/1.3 var(--ui);letter-spacing:-.01em;color:var(--fg);cursor:pointer}
.sh2:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--fg-3)}
html.lh .sname .meta{font:400 12px var(--ui);color:var(--fg-3)}
html.lh .sname .meta b{color:var(--accent);font-weight:600}
html.lh .prog2{height:2px;margin:12px 0 2px;background:var(--border);border-radius:2px}
html.lh .prog2 span{background:var(--fg-3);transition:width var(--t-slow) var(--ease)}
html.lh .topics{margin-top:2px}
html.lh .topic{padding:7px 0;border-top:1px solid var(--border)}
html.lh .topic:first-child{border-top:0}
html.lh .trow{gap:6px;min-height:28px}
html.lh .tname{font:600 14px var(--ui);letter-spacing:-.005em}
html.lh .trow .n{font-size:12px;color:var(--fg-3)}
.tdue{font-size:12px;font-weight:500;color:var(--fg-2)}
.tdue::before{content:"·";margin-right:6px;color:var(--fg-3)}
.tempty{font-size:12px;color:var(--fg-3)}
.topic.is-empty .tname{color:var(--fg-3);font-weight:500}
.chev{transition:background var(--t-fast),color var(--t-fast)}
.tbody{margin:6px 0 4px 28px}
.decks{display:flex;flex-wrap:wrap;gap:6px}
.deck{display:inline-flex;align-items:center;gap:7px;height:28px;max-width:100%;min-width:0;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:transparent;color:var(--fg);font:500 13px var(--ui);text-align:left;transition:background var(--t-fast),border-color var(--t-fast)}
.deck:hover{background:var(--hover);border-color:var(--border-2)}
.deck:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.deck .dn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck .dc{color:var(--fg-3);font-size:12px;flex:none}
.deck .dd{color:var(--fg-2);font-size:12px;font-weight:500;flex:none}
.deck .dd::before{content:"·";margin-right:6px;color:var(--fg-3)}
.deck .demj{font-size:14px;line-height:1}
.deck.zero{color:var(--fg-3);border-style:dashed}
.deck.dropok{outline:2px dashed var(--accent);outline-offset:2px}
.deck[draggable="true"]{cursor:pointer}
@media (hover:hover){ html.lh .icon.soft{opacity:0;transition:opacity var(--t-fast)} html.lh .subj:hover > .shd .icon.soft,html.lh .trow:hover .icon.soft,html.lh .icon.soft:focus-visible{opacity:1} }
html.lh .hfoot .link{font-size:12px;color:var(--fg-3)}
html.lh .hfoot .link:hover{color:var(--fg)}
html.lh .hhint{font:400 12px var(--ui);color:var(--fg-3)}
html.lh .none{font-size:13px}

/* overview */
html.lh .ovcard{border:1px solid var(--border);border-radius:var(--r-md);padding:28px 24px}
html.lh .ovcard h1{font:600 22px/1.25 var(--ui);letter-spacing:-.015em}
html.lh .ovtiles div,html.lh .ovtiles button{background:none;border:0;border-radius:var(--r-sm);padding:4px 10px}
html.lh .ovtiles button:hover{background:var(--hover)}
html.lh .ovtiles b{font:600 22px/1.2 var(--ui)}
html.lh .ovtiles span{font:400 12px var(--ui);color:var(--fg-3);letter-spacing:0}
html.lh .crumbs{font-size:13px}

/* ---------- study ---------- */
html.lh .lhstudy{max-width:760px}
html.lh .lhhead{margin-bottom:22px}
html.lh .lhrow{align-items:center;gap:12px;flex-wrap:wrap}
html.lh .lhcrumb{flex:1;min-width:0;margin:0;font:500 13px/1.4 var(--ui);letter-spacing:0;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.lh .lhcrumb i{font-style:normal;margin:0 6px;color:var(--border-2)}
html.lh .lhcrumb b{color:var(--fg);font-weight:600}
html.lh .lhpills{gap:2px;padding:0;align-items:center}
html.lh .lhpill{height:26px;padding:0 8px;gap:6px;border:0;border-radius:var(--r-sm);background:none;font:500 12px var(--ui);letter-spacing:0;color:var(--fg-3)}
html.lh .lhpill svg{width:13px;height:13px}
html.lh button.lhpill:hover{background:var(--hover);color:var(--fg)}
html.lh .lhpill.on{color:var(--fg)}
html.lh .tpill.over{color:var(--again)}
.lhstatus{font-size:12px;color:var(--fg-3);padding-left:8px;white-space:nowrap}
html.lh .lhhead .sbar{height:2px;margin:12px 0 0;background:var(--border);border-radius:2px}
html.lh .lhhead .sbar span{background:var(--accent);transition:width .45s var(--ease)}
html.lh .qa{font-family:var(--card);font-size:17px;line-height:1.6;color:var(--fg)}
html.lh .qa .label{font:500 12px var(--ui);letter-spacing:0;color:var(--fg-3);margin-bottom:12px;gap:8px}
html.lh .lhtag{font:600 12px var(--ui);letter-spacing:0;border:1px solid var(--border-2);border-radius:4px;padding:0 6px;color:var(--fg-2)}
html.lh .qa img{border-radius:var(--r-sm)}
html.lh .qa hr{height:2px;border:0;margin:28px 0 21px;background:linear-gradient(var(--accent),var(--accent)) no-repeat 0 0/0 100%,linear-gradient(var(--border),var(--border)) no-repeat 0 50%/100% 1px}
html.lh .qa hr.sweep{animation:sweep .75s var(--ease) both}
@keyframes sweep{0%{background-size:0 100%,100% 1px;background-position:0 0,0 50%}45%{background-size:100% 100%,100% 1px;background-position:0 0,0 50%}100%{background-size:0 100%,100% 1px;background-position:110% 0,0 50%}}
html.lh .answer{animation:none}
html.lh .sect{background:none;border:0;border-radius:0;padding:0;margin:0 0 24px}
html.lh .sect:last-child{margin-bottom:0}
html.lh .answer .sect{animation:rise .26s var(--ease) both}
html.lh .answer .sect + .sect{animation-delay:.07s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
html.lh .sect h3{display:flex;align-items:center;gap:7px;font:600 12px var(--ui);letter-spacing:0;margin:0 0 8px}
html.lh .sect h3::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
html.lh .sect .stext,html.lh .sect.mistake .stext,html.lh .sect.solution .stext,html.lh .sect.explain .stext{font-family:var(--card);font-size:17px;font-weight:400;color:var(--fg);line-height:1.6}
html.lh .sect.mistake .stext{font-weight:500}
html.lh .sect img{border-radius:var(--r-sm)}
html.lh .sect .muted{font-size:14px !important;font-style:normal}
html.lh .inline-add .link{padding-left:0;font-size:13px}
html.lh .dock{margin:28px 0 0;max-width:none;border:0;background:none;padding:0;gap:10px;display:flex;flex-direction:column}
html.lh .dock.dock-show{flex-direction:row;align-items:center;justify-content:flex-end;gap:14px;padding:0}
html.lh .dock .hintm{font:400 13px var(--ui);color:var(--fg-3);letter-spacing:0}
html.lh .lhrates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
html.lh .lhrate{position:relative;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 6px;border-radius:var(--r-sm);border:1px solid var(--border-2);background:var(--surface);font:600 14px var(--ui);color:var(--fg);transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast)}
html.lh .lhrate span{color:var(--rc)}
html.lh .lhrate small{font:500 12px var(--ui);color:var(--fg-3)}
html.lh .lhrate kbd{position:absolute;top:6px;right:7px;min-width:16px;height:16px;font-size:10px;border-color:transparent}
html.lh .lhrate:hover{border-color:color-mix(in srgb, var(--rc) 55%, var(--border-2));background:color-mix(in srgb, var(--rc) 7%, var(--surface))}
html.lh .lhrate:active,html.lh .lhrate.pressed{transform:scale(.98);border-color:var(--rc);background:color-mix(in srgb, var(--rc) 14%, var(--surface))}
.dhint{margin:2px 0 0;font-size:12px;color:var(--fg-3);text-align:center}
html.lh .answerbar.lhbar{background:var(--bar);border-top:1px solid var(--border)}
html.lh .lhb{height:28px;padding:0 10px;font:500 13px var(--ui);letter-spacing:0;color:var(--fg-2);border-radius:var(--r-sm)}
html.lh .lhstat{position:relative;font:500 12px var(--ui);letter-spacing:0;color:var(--fg-3)}
#rflash{position:absolute;left:50%;bottom:calc(100% + 22px);transform:translateX(-50%);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border-2);color:var(--fg);font:500 12px var(--ui);opacity:0;pointer-events:none}
#rflash::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rc,var(--accent))}
#rflash.on{animation:flash 1.6s var(--ease) both}
@keyframes flash{0%{opacity:0;transform:translate(-50%,6px)}12%{opacity:1;transform:translate(-50%,0)}75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-4px)}}
html.lh .lhstudy .qa.fadein{animation:enter .24s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
html.lh .qa.leaving,html.lh #lhdock.leaving{animation:leave .13s ease-in both}
@keyframes leave{to{opacity:0;transform:translateY(-8px)}}
html.lh .done{border-radius:var(--r-md);border-color:var(--border)}
html.lh .done h1{font:600 22px var(--ui);letter-spacing:-.015em}
html.lh .padwrap{border-radius:var(--r-md)}
html.lh .padb{font-family:var(--ui)}

/* ---------- stats ---------- */
.ptitle{margin:0 0 16px;font:600 22px/1.2 var(--ui);letter-spacing:-.015em}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);margin-bottom:14px;overflow:hidden}
.statrow > div{padding:14px 18px;border-left:1px solid var(--border);min-width:0}
.statrow > div:first-child{border-left:0}
.statrow b{display:block;font:600 22px/1.25 var(--ui);color:var(--fg)}
.statrow b small{font-size:13px;font-weight:500;color:var(--fg-3)}
.statrow span{font-size:12px;color:var(--fg-3)}
@media (max-width:760px){ .statrow{grid-template-columns:repeat(2,minmax(0,1fr))} .statrow > div:nth-child(3){border-left:0} .statrow > div:nth-child(n+3){border-top:1px solid var(--border)} }
html.lh .bar i{background:var(--fg-3);opacity:.4;border-radius:3px 3px 1px 1px;transition:height var(--t-slow) var(--ease)}
html.lh .bar.now i{background:var(--accent);opacity:1}
html.lh .bar span,html.lh .bar b{font:500 11px var(--ui)}
html.lh .hbar{height:6px;border-radius:3px}
html.lh .hbar span{background:var(--fg-3)}
html.lh .cbar b,html.lh .cb small,html.lh .cb em{font-family:var(--ui)}

/* ---------- page changes: a short rise, nothing on scroll ---------- */
#root.pagein > *{animation:pagein .2s var(--ease) both}
@keyframes pagein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.subj.opening .topics,.topic.opening .tbody{animation:unfold .2s var(--ease) both;transform-origin:top}
@keyframes unfold{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  #root.pagein > *,.subj.opening .topics,.topic.opening .tbody,html.lh .answer .sect,html.lh .lhstudy .qa.fadein,html.lh .qa.leaving,html.lh #lhdock.leaving,html.lh .toast{animation:none !important}
  html.lh .qa hr.sweep{animation:none}
  #rflash.on{animation:none;opacity:1}
  html.lh .lhhead .sbar span,html.lh .prog2 span,html.lh .bar i{transition:none}
}

/* theme preview keeps the study look at a smaller size */
html.lh .tprev .sect{margin-bottom:14px}
html.lh .tprev .sect .stext,html.lh .tprev .sect.mistake .stext{font-size:14px}
html.lh .tprev .qtext{font-size:15px}
.btn.r1{--rc:var(--again)} .btn.r2{--rc:var(--hard)} .btn.r3{--rc:var(--good)} .btn.r4{--rc:var(--easy)}
html.lh .ease .btn[class*=" r"]{color:var(--rc)}
html.lh .trow .n,.tdue,.tempty,.deck .dc,.deck .dd{white-space:nowrap}
html.lh .tname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){
  html.lh .lhrow{row-gap:8px}
  html.lh .lhcrumb{flex-basis:100%}
  html.lh .lhpills{margin-left:-8px}
  html.lh .lhrates{gap:6px}
  html.lh .lhrate{height:50px}
  html.lh .lhrate kbd{display:none}
  .tbody{margin-left:20px}
}

/* accent as text needs to stay readable on light themes */
.hsub b,html.lh .sname .meta b,.siderec .meta b{color:color-mix(in srgb, var(--accent) 72%, var(--fg))}

/* ===================== Recall design system, part 2 (see CLAUDE.md) =====================
   Contrast is the foundation: page (darkest), panels one step lighter, controls one step lighter again.
   Each theme = two colours that sit together (page family + its complement, --accent-2) and one colour
   that asks for attention (--accent / --accent-btn): the main button, progress and what's due.
   Spacing steps: 4 8 12 16 20 24 32. Type steps: 11 12 13 14 15 16 17 20 24. */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--appbar:52px;--sidew:236px}
html.lh body{background:var(--bg);color:var(--fg)}
html.lh ::selection{background:color-mix(in srgb, var(--accent) 32%, transparent)}
html.lh .link:hover{color:var(--fg)}
html.lh .link.acc{color:var(--accent);font-weight:600}
html.lh .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
html.lh .btn svg{width:14px;height:14px;flex:none}
html.lh .btn.primary{background:var(--accent-btn)}
html.lh .seg button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
html.lh .in{background:var(--inset);border:1px solid var(--border-2);color:var(--fg)}
html.lh .icon.soft{color:var(--fg-3)}
html.lh .icon.soft:hover{color:var(--fg);background:var(--hover)}
html.lh .banner{margin:0 0 var(--s4)}

/* ---------- nav cluster beside the traffic lights, and the page toolbar ---------- */
.navcl,.appbar{display:none}
body.desktop .navcl{display:flex;align-items:center;gap:2px;position:fixed;top:12px;left:84px;z-index:40;-webkit-app-region:no-drag}
html.win body.desktop .navcl{top:4px;left:8px}
html.hosted body.desktop .navcl{top:max(10px, env(safe-area-inset-top));left:12px}
.ncb{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:var(--r-sm);background:transparent;color:var(--fg-2);cursor:pointer;padding:0;transition:background var(--t-fast),color var(--t-fast)}
.ncb svg{width:16px;height:16px}
.ncb:hover:not(:disabled){background:rgba(var(--ovr),.08);color:var(--fg)}
.ncb:disabled{color:var(--fg-3);opacity:.45;cursor:default}
html.lh body.desktop .sidetoggle{display:none}
html.lh body.desktop .toolbar{padding-top:56px}
html.win body.desktop .toolbar,html.lh html.win body.desktop .toolbar{padding-top:44px}
html.lh.win body.desktop .toolbar{padding-top:44px}
html.lh.hosted body.desktop .toolbar{padding-top:max(52px, calc(env(safe-area-inset-top) + 42px))}

body.desktop .appbar{display:flex;align-items:center;gap:var(--s3);position:fixed;top:0;left:var(--sidew);right:0;height:var(--appbar);padding:0 var(--s4) 0 var(--s6);z-index:30;background:var(--side-solid);border-bottom:1px solid var(--border-2);-webkit-app-region:drag;transition:left .25s var(--ease),padding .25s var(--ease)}
body.desktop.sidebar-hidden .appbar{left:0;padding-left:128px}
html.fs body.desktop .navcl{left:12px}
html.fs body.desktop.sidebar-hidden .appbar{padding-left:56px}
html.win body.desktop.sidebar-hidden .appbar,html.hosted body.desktop.sidebar-hidden .appbar{padding-left:56px}
html.win body.desktop .appbar{padding-right:150px}
html.hosted body.desktop .appbar{top:0;height:calc(var(--appbar) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}
.appbar button,.appbar select,.appbar input,.appbar .seg{-webkit-app-region:no-drag}
.abt{display:flex;align-items:center;gap:6px;min-width:0;flex:1;font:500 13px var(--ui);color:var(--fg-3);white-space:nowrap;overflow:hidden}
.abt b{font:600 15px var(--ui);color:var(--fg);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.abt span{overflow:hidden;text-overflow:ellipsis}
.abt i{font-style:normal;color:var(--border-2)}
.abt .abmeta{margin-left:6px;color:var(--fg-3);font-size:13px}
.abcr{border:0;background:none;padding:2px 4px;margin:0 -4px;border-radius:4px;font:500 13px var(--ui);color:var(--fg-3);cursor:pointer}
.abcr:hover{color:var(--fg);background:rgba(var(--ovr),.06)}
.appbar[data-v="overview"] .abt b,.appbar[data-v="study"] .abt b{font-size:13px}
.abr{display:flex;align-items:center;gap:var(--s2);flex:none}
.abr .btn{height:30px}
.abn{margin-left:8px;padding:0 6px;min-width:20px;height:18px;display:inline-grid;place-items:center;border-radius:9px;background:color-mix(in srgb, var(--btn-fg) 14%, transparent);font:600 12px var(--ui);font-variant-numeric:tabular-nums}
.abi{height:30px;min-width:30px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--fg-2);font:600 13px var(--ui);font-variant-numeric:tabular-nums;cursor:pointer;transition:background var(--t-fast),color var(--t-fast)}
.abi svg{width:16px;height:16px}
.abi:hover:not(:disabled){background:rgba(var(--ovr),.07);color:var(--fg)}
.abi:disabled{opacity:.35;cursor:default}
.abi.on{background:rgba(var(--ovr),.09);color:var(--fg)}
.abi span:empty{display:none}
.absep{width:1px;height:18px;background:var(--border);margin:0 4px}
.abcount{font:600 13px var(--ui);color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.abcount span{font-weight:500;color:var(--fg-3)}
.abprog{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent-btn);transform-origin:left;transition:transform .45s var(--ease)}
.abseg{display:flex}
.abseg button{height:28px;padding:0 10px;font-size:12px}
.appbar #rflash{margin-right:4px}
body.desktop .page,html.lh body.desktop .page{padding-top:calc(var(--appbar) + 28px)}
body.desktop.sidebar-hidden .page{padding-top:calc(var(--appbar) + 28px)}
html.hosted body.desktop .page{padding-top:calc(var(--appbar) + env(safe-area-inset-top) + 28px)}
body.desktop::after{display:none}
body.desktop .ptitle,body.desktop .narrow > .crumbs{display:none}
body.desktop .btable th{top:var(--appbar)}
body.desktop .sidebar{top:calc(var(--appbar) + 20px);max-height:calc(100vh - var(--appbar) - 40px)}
/* study: the toolbar carries the breadcrumb, timer, scratchpad, shuffle and position */
html.lh body.desktop .lhhead{display:none}
html.lh body.desktop .answerbar.lhbar{display:none}
html.lh body.desktop .page.reviewer{padding-bottom:120px}

/* ---------- sidebar ---------- */
html.lh body.desktop .toolbar{background:var(--side);border-right:1px solid var(--border)}
html.lh body.desktop .toolbar .sidesub .dot{width:8px;height:8px}
html.lh body.desktop .toolbar nav button[aria-current="true"] .ni{color:var(--accent-2)}

/* ---------- Decks: subject tabs ---------- */
.dkhome,body.desktop .home.dkhome{max-width:1240px}
.stabs{position:relative;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--border);margin:0 0 var(--s6);overflow-x:auto;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stab{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;background:transparent;color:var(--fg-3);font:500 14px var(--ui);white-space:nowrap;cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0;transition:color var(--t-fast),background var(--t-fast)}
.stab:hover{color:var(--fg);background:rgba(var(--ovr),.04)}
.stab[aria-selected="true"]{color:var(--fg);font-weight:600}
.sdot2{width:8px;height:8px;border-radius:50%;background:var(--sc);flex:none}
.stabn{font:600 12px var(--ui);color:var(--fg-3);font-variant-numeric:tabular-nums}
.stab[aria-selected="true"] .stabn{color:var(--accent)}
.stabadd{width:40px;padding:0;justify-content:center}
.stabadd svg{width:14px;height:14px}
.stabind{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--fg);border-radius:3px 3px 0 0;transition:transform .32s var(--ease),width .32s var(--ease),background .32s var(--ease);pointer-events:none}

/* title row */
.dkhead{display:flex;align-items:center;gap:var(--s4);margin:0 0 var(--s5)}
.dkt{flex:1;min-width:0}
.dkt h1{margin:0;font:600 24px/1.2 var(--ui);letter-spacing:-.02em;color:var(--fg)}
.dkmeta{margin:4px 0 0;font:400 13px var(--ui);color:var(--fg-3)}
.dkmeta b{color:var(--accent);font-weight:600}
.dkmeta .mlink{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--border-2);text-underline-offset:3px}
.dkmeta .mlink:hover{color:var(--fg)}
.tick{font-variant-numeric:tabular-nums}
.dkprog{width:220px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:none}
.dkprog span{display:block;height:100%;border-radius:3px;background:var(--sc);transform-origin:left;animation:dk-bar .7s var(--ease) both}
@keyframes dk-bar{from{transform:scaleX(0)}}

/* topic cards: two even columns, big bubbles filled and bold, subtopics outlined */
.tcols{columns:2 400px;column-gap:var(--s4)}
.tcard,.tmts,.tnew{break-inside:avoid;margin:0 0 var(--s4)}
.tcard{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4) var(--s4) 18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--border);transition:border-color var(--t-med)}
.tcard.dropok{outline:2px dashed var(--accent);outline-offset:2px}
.tch{display:flex;align-items:center;gap:8px;min-height:28px}
.tcn{border:0;background:none;padding:0;color:var(--fg);font:600 16px/1.3 var(--ui);letter-spacing:-.01em;text-align:left;cursor:pointer;min-width:0}
.tcn:hover{text-decoration:underline;text-decoration-color:var(--border-2);text-underline-offset:4px}
.tcc{font:500 13px var(--ui);color:var(--fg-3);font-variant-numeric:tabular-nums}
.tcd{font:600 12px var(--ui);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.tch .icon{width:26px;height:26px;opacity:.5;transition:opacity var(--t-fast)}
.tcard:hover .tch .icon,.tch .icon:focus-visible{opacity:1}
.tcnone{margin:0;font:400 13px var(--ui);color:var(--fg-3)}
.bbubs{display:flex;flex-wrap:wrap;gap:var(--s2)}
.bbub{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--border-2);background:var(--surface-2);color:var(--fg);font:600 14px var(--ui);cursor:pointer;transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast);box-shadow:inset 0 1px 0 rgba(var(--ovr),.04)}
.bbub:hover{background:var(--hover);border-color:color-mix(in srgb, var(--fg) 30%, var(--border-2))}
.bbub:active{transform:scale(.98)}
.bbc{font:500 13px var(--ui);color:var(--fg-3);font-variant-numeric:tabular-nums}
.bbd{font:600 12px var(--ui);color:var(--accent);font-variant-numeric:tabular-nums}
.bbub.zero{background:transparent;border-style:dashed;color:var(--fg-2)}
.schips{display:flex;flex-wrap:wrap;gap:6px}
.schip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:var(--r-sm);border:1px solid var(--border-2);background:transparent;color:var(--fg);font:500 13px var(--ui);cursor:pointer;transition:background var(--t-fast),border-color var(--t-fast)}
.schip:hover{background:rgba(var(--ovr),.05);border-color:color-mix(in srgb, var(--fg) 26%, var(--border-2))}
.scc{color:var(--fg-3);font-variant-numeric:tabular-nums}
.scc b{color:var(--fg-2);font-weight:600}
.bbub.dropok,.schip.dropok,.stab.dropok{outline:2px dashed var(--accent);outline-offset:2px}
.bbub.dragging,.schip.dragging{opacity:.4}
.tmts{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding:var(--s3) var(--s4);border:1px dashed var(--border-2);border-radius:var(--r-lg)}
.tmtl{width:100%;font:600 12px var(--ui);color:var(--fg-3);margin-bottom:2px}
.tmt{border:0;background:none;padding:3px 6px;margin-left:-6px;border-radius:4px;color:var(--fg-2);font:500 13px var(--ui);cursor:pointer;text-align:left}
.tmt:hover{color:var(--fg);background:rgba(var(--ovr),.05)}

.tnew{display:flex;width:100%;align-items:center;justify-content:center;gap:6px;height:44px;border:1px dashed var(--border-2);border-radius:var(--r-lg);background:transparent;color:var(--fg-2);font:500 13px var(--ui);cursor:pointer;transition:color var(--t-fast),border-color var(--t-fast),background var(--t-fast)}
.tnew svg{width:13px;height:13px}
.tnew:hover{color:var(--fg);border-color:var(--fg-3);background:rgba(var(--ovr),.03)}

/* lower half: grouped lists */
.dklower{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4) var(--s6);margin:var(--s6) 0 0;padding-top:var(--s6);border-top:1px solid var(--border)}
.glhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px;margin:0 0 var(--s2)}
.glhead h2{margin:0;font:600 15px var(--ui);color:var(--fg);letter-spacing:-.01em}
.glist{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.glrow{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 14px;border:0;background:transparent;color:var(--fg);text-align:left;cursor:pointer;transition:background var(--t-fast)}
.glrow:hover{background:var(--hover)}
.glrow + .glrow::before{content:"";position:absolute;top:0;left:32px;right:0;height:1px;background:var(--border)}
.glist.plain .glrow + .glrow::before{left:14px}
.gldot{width:8px;height:8px;border-radius:50%;flex:none}
.gln{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.gln > span{font:500 14px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gln small{font:400 12px var(--ui);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glm{font:400 13px var(--ui);color:var(--fg-3);white-space:nowrap}
.glm b{color:var(--accent);font-weight:600}
.glx{height:20px;padding:0 7px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb, var(--again) 16%, transparent);color:var(--again);font:600 12px var(--ui);font-variant-numeric:tabular-nums}
.glnone{margin:0;padding:var(--s4);border:1px dashed var(--border-2);border-radius:var(--r-lg);font:400 13px var(--ui);color:var(--fg-3)}
.dkempty{max-width:440px;margin:12vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.dkempty h1{margin:0;font:600 24px var(--ui);letter-spacing:-.02em}
.dkempty p{margin:0 0 var(--s2);color:var(--fg-3);font-size:14px}
html.lh .dkhome .hfoot{margin-top:var(--s8);padding-top:var(--s4);border-top:1px solid var(--border);gap:var(--s4)}

/* motion: switching subjects slides the underline and lifts the cards in one after another */
.dkbody.swap .dkhead{animation:dk-in .28s var(--ease) both}
.dkbody.swap .tcard,.dkbody.swap .tmts,.dkbody.swap .tnew{animation:dk-rise .36s var(--ease) both;animation-delay:calc(var(--i, 0) * 40ms + 40ms)}
.dkbody.swap .dklower{animation:dk-in .4s var(--ease) .14s both}
#root.pagein .tcard,#root.pagein .tmts,#root.pagein .tnew{animation:dk-rise .4s var(--ease) both;animation-delay:calc(var(--i, 0) * 45ms + 60ms)}
#root.pagein .dklower{animation:dk-in .4s var(--ease) .18s both}
@keyframes dk-rise{from{opacity:0;transform:translateY(10px)}}
@keyframes dk-in{from{opacity:0;transform:translateY(4px)}}

/* ---------- study ---------- */
html.lh .qa .label{display:flex;align-items:center;flex-wrap:wrap}
.qmk{font:500 12px var(--ui);color:var(--fg-3)}
.qmk::before{content:"·";margin-right:8px}
.qtime{margin-left:auto;display:inline-flex;align-items:baseline;gap:8px;font:400 12px var(--ui);color:var(--fg-3)}
.qtime b{font:600 20px/1 var(--ui);color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.qtime.warn b{color:var(--hard)}
.qtime.over b{color:var(--again)}
.qtime.paused b{color:var(--fg-3)}
.qtime.took{font:500 13px var(--ui);color:var(--fg-2)}
.qtp{font:600 11px var(--ui);color:var(--fg-3);padding:1px 6px;border:1px solid var(--border-2);border-radius:4px}
.qtbar{height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin:-4px 0 16px}
.qtbar i{display:block;height:100%;background:var(--fg-3);transform-origin:left;transition:transform .25s linear,background .3s}
.qtbar.warn i{background:var(--hard)}
.qtbar.over i{background:var(--again)}
.qtbar.took i{background:var(--fg-3)}
/* timer popover */
.tpop{position:fixed;z-index:70;width:360px;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4);background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r-lg);box-shadow:0 18px 48px rgba(0,0,0,.4);animation:tp-in .16s var(--ease) both;font:400 13px var(--ui);color:var(--fg)}
@keyframes tp-in{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.tseg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tseg button{height:30px;padding:0 8px}
.tpsec{display:flex;flex-direction:column;gap:var(--s2)}
.tplbl{font:600 12px var(--ui);color:var(--fg-2)}
.tpopt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--border-2);cursor:pointer;transition:border-color var(--t-fast),background var(--t-fast)}
.tpopt.on{border-color:var(--fg-2);background:var(--hover)}
.tpopt input{margin:0;accent-color:var(--accent-btn);align-self:flex-start;margin-top:2px}
.tpopt > span:first-of-type{display:flex;flex-direction:column;gap:2px;flex:1}
.tpopt b{font:500 13px var(--ui)}
.tpopt small{font:400 12px var(--ui);color:var(--fg-3)}
.tstep{display:flex;align-items:center;border:1px solid var(--border-2);border-radius:var(--r-sm);overflow:hidden}
.tstep button{width:26px;height:26px;border:0;background:transparent;color:var(--fg-2);font:500 15px var(--ui);cursor:pointer}
.tstep button:hover{background:var(--hover);color:var(--fg)}
.tstep b{padding:0 6px;font:600 13px var(--ui);font-variant-numeric:tabular-nums;min-width:42px;text-align:center}
.tpfoot{display:flex;align-items:center;gap:8px;padding-top:var(--s3);border-top:1px solid var(--border-2);font:400 12px var(--ui);color:var(--fg-3)}
.tpfoot .grow{flex:1}
.tpsel{height:26px;padding:0 6px;font:500 12px var(--ui);width:auto}

/* ---------- card builder: a full window, fields on the left, live preview on the right ---------- */
.scrim:has(> .builder){padding:0;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;overflow:hidden}
html.lh .dialog.builder{position:fixed;inset:0;max-width:none;width:auto;border:0;border-radius:0;box-shadow:none;background:var(--bg);display:flex;flex-direction:column;animation:b-in .26s var(--ease) both}
@keyframes b-in{from{opacity:0;transform:translateY(12px)}}
html.lh .builder > .bhead{position:relative;top:auto;flex:none;display:flex;align-items:center;gap:var(--s2);height:var(--appbar);padding:0 var(--s4) 0 84px;border-bottom:1px solid var(--border);background:var(--bg);border-radius:0;-webkit-app-region:drag}
html.win .builder > .bhead{padding-left:var(--s3);padding-right:150px}
html:not(.desktop) .builder > .bhead,html.hosted .builder > .bhead{padding-left:var(--s3);padding-top:env(safe-area-inset-top);height:calc(var(--appbar) + env(safe-area-inset-top))}
.builder > .bhead button,.builder > .bhead .ednav{-webkit-app-region:no-drag}
.builder .bhead h2{flex:none;margin:0 0 0 2px;font:600 15px var(--ui);letter-spacing:-.01em;white-space:nowrap}
.bwhere{font:400 13px var(--ui);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bback{width:28px;height:28px}
.bback svg{width:14px;height:14px}
.bdraft{font:400 12px var(--ui);color:var(--fg-3);white-space:nowrap;margin-right:var(--s2)}
.bdraft .link{font-size:12px;padding:0}
.bdanger{display:none;gap:8px;padding-top:var(--s4);border-top:1px solid var(--border)}
.bsep{width:1px;height:18px;background:var(--border);margin:0 4px}
.builder .bhead kbd{margin-left:8px}
.bcols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.bform{overflow-y:auto;padding:var(--s6) 28px 64px;display:flex;flex-direction:column;gap:var(--s5);border-right:1px solid var(--border)}
.bform > *{max-width:680px;width:100%;margin-left:auto;margin-right:auto}
.bfrow{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.bfrow .hint{font:400 12px var(--ui);color:var(--fg-3)}
.builder .field{gap:6px}
.builder #eq{min-height:96px;font-size:15px;line-height:1.5;padding:12px 14px}
.builder .rtein{font-size:15px;line-height:1.5}
.mkrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mkrow .seg button{min-width:34px;height:30px;padding:0 9px}
.mkn{width:72px;height:30px;padding:0 8px}
.bprev{overflow-y:auto;padding:var(--s6) 32px 64px;background:var(--surface);display:flex;flex-direction:column;gap:var(--s3)}
.bprev > *{max-width:640px;width:100%;margin-left:auto;margin-right:auto}
.bprevh{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 12px var(--ui);color:var(--fg-3)}
.bprevh .seg button{height:26px;padding:0 10px;font-size:12px}
.bcard{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg);padding:22px 24px}
html.lh .bqa{max-width:none;margin:0;font-size:16px}
.bqa .bhr{height:2px;border:0;margin:22px 0 16px;background:linear-gradient(90deg,var(--accent-btn) 0 30%,var(--border) 30%);animation:none}
.bnone{font:400 14px var(--ui) !important;color:var(--fg-3)}
@media (max-width:900px){
  .bcols{grid-template-columns:1fr}
  .bprev{display:none}
  .bform{border-right:0;padding:var(--s5) var(--s4) 64px}
  .builder .bhead kbd,.bwhere,.bdraft,.builder .bhead [data-act="reset-srs"],.builder .bhead [data-act="del-card"],.builder .bhead .bsep,.builder .bhead .btn[data-act="close"]{display:none}
  .bdanger{display:flex}
}

/* ---------- new topic form ---------- */
.tdialog .body{gap:var(--s5)}
.tdialog .field .hint{display:block;font:400 12px var(--ui);color:var(--fg-3);margin:-2px 0 4px}
.tdialog select.in{height:34px;padding:0 10px;font:500 13px var(--ui)}
.tdtypes{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.tdtype{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border-2);background:transparent;color:var(--fg-2);font:500 13px var(--ui);cursor:pointer;transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast)}
.tdtype svg{width:12px;height:12px;display:none}
.tdtype[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.tdtype[aria-pressed="true"] svg{display:block}
.tdtype.add{border-style:dashed;color:var(--fg-3)}
.tdtype:hover:not([aria-pressed="true"]){color:var(--fg);background:var(--hover)}
.tdcin{height:32px;width:180px;padding:0 10px}
.tdchips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:36px;padding:4px !important;height:auto !important;cursor:text}
.tdchips input{flex:1;min-width:120px;border:0;background:transparent;color:var(--fg);font:400 14px var(--ui);padding:4px 6px;outline:none}
.tdchip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 4px 0 9px;border-radius:4px;background:var(--hover);font:500 13px var(--ui);animation:dk-in .16s var(--ease) both}
.tdchip button{width:18px;height:18px;display:grid;place-items:center;border:0;background:none;color:var(--fg-3);padding:0;border-radius:3px;cursor:pointer}
.tdchip button svg{width:9px;height:9px}
.tdchip button:hover{color:var(--fg);background:rgba(var(--ovr),.08)}
.tdprevw{border-top:1px solid var(--border);padding-top:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.tdprev{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:var(--r-lg);background:var(--bg);border:1px solid var(--border)}
.tdpn{font:600 15px var(--ui);letter-spacing:-.01em}
.tdpn small{display:block;font:400 12px var(--ui);color:var(--fg-3);margin-bottom:2px}
.tdprev .bbub,.tdprev .schip{cursor:default}

/* ---------- themes ---------- */
.thpage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s8);max-width:1240px;margin:0 auto}
.thgrp{margin:0 0 var(--s3);font:600 12px var(--ui);color:var(--fg-3)}
.thgrp + .thcards + .thgrp{margin-top:var(--s6)}
.thcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s4)}
.thc{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;min-width:0;padding:0;border:0;background:none;color:var(--fg);text-align:left;cursor:pointer}
.thc > span{display:flex;width:100%;box-sizing:border-box}
.thc > .thc-tag{display:block}
.thc-win{display:flex;height:112px;border-radius:var(--r-md);overflow:hidden;background:var(--tb);box-shadow:0 0 0 1px var(--border);transition:box-shadow var(--t-med),transform var(--t-med)}
.thc:hover .thc-win{box-shadow:0 0 0 1px var(--fg-3);transform:translateY(-1px)}
.thc[aria-pressed="true"] .thc-win{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent-btn)}
.thc-side{width:30%;background:var(--tsd);display:flex;flex-direction:column;gap:6px;padding:12px 8px}
.thc-side i,.thc-main i{display:block;height:5px;border-radius:3px;background:var(--tl);width:60%}
.thc-side i.a{background:var(--ta);width:72%;height:6px}
.thc-main{flex:1;display:flex;flex-direction:column;gap:6px;padding:12px}
.thc-main i.t{background:var(--tf);height:7px;width:55%}
.thc-main i.s{height:22px;width:100%;background:var(--tsf);border-radius:4px}
.thc-row{display:flex;gap:4px;margin-top:auto}
.thc-row b{flex:1;height:10px;border-radius:3px}
.thc-row b.p{flex:1.4}
.thc-name{display:flex;align-items:center;gap:6px;font:500 13px var(--ui)}
.thc-name > span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thc-tag{font:400 12px var(--ui);color:var(--fg-3);margin-top:-4px}
.thc-pal{display:inline-flex;flex:none}
.thc-pal i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1.5px var(--bg)}
.thc-pal i + i{margin-left:-3px}
.threcipe{display:flex;align-items:center;gap:12px;margin:var(--s6) 0 0;padding:var(--s4) 0 0;border-top:1px solid var(--border);font:400 13px var(--ui);color:var(--fg-2);max-width:640px}
.threcipe .thc-pal i{width:16px;height:16px}
.thrail{display:flex;flex-direction:column;gap:var(--s5);padding-left:var(--s6);border-left:1px solid var(--border)}
.thrail h3{margin:0 0 10px;font:600 13px var(--ui);color:var(--fg)}
.thrail .sub{margin:8px 0 0;font-size:12px}
.swrow{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;width:24px;height:24px;border-radius:50%;border:0;padding:0;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);transition:transform var(--t-fast),box-shadow var(--t-fast)}
.sw:hover{transform:scale(1.08)}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.sw.swth{background:conic-gradient(var(--c) 0 50%, var(--fg-3) 50% 100%)}
.sw.sm{width:16px;height:16px}
.sw.sm.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.swpick{display:inline-block;background:conic-gradient(#ff5a67,#ffb648,#3ddc84,#45c3f5,#b18cff,#ff5a67);overflow:hidden}
.swpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.scrow{display:flex;align-items:center;gap:10px;height:36px;border-top:1px solid var(--border);font:500 13px var(--ui)}
.scn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scdots{display:flex;gap:6px;align-items:center}
.thmore{border-top:1px solid var(--border);padding-top:var(--s3)}
.thmore summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font:600 13px var(--ui);color:var(--fg)}
.thmore summary::-webkit-details-marker{display:none}
.thmore summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--fg-3);border-bottom:1.5px solid var(--fg-3);transform:rotate(-45deg);transition:transform var(--t-med) var(--ease);margin-right:2px}
.thmore[open] summary::before{transform:rotate(45deg)}
.thmore[open] > :not(summary){animation:dk-in .2s var(--ease) both}
.thmore[open] summary{margin-bottom:var(--s3)}
.thcnt{font:500 12px var(--ui);color:var(--accent)}
.thrail .cgroups{grid-template-columns:1fr;gap:var(--s3)}
.thrail .crow{grid-template-columns:minmax(0,1fr) 30px 76px 22px}
.thrail .bgprev{height:110px}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}

/* ---------- phones and narrow windows ---------- */
@media (max-width:900px){
  .thpage{grid-template-columns:1fr}
  .thrail{padding-left:0;border-left:0;border-top:1px solid var(--border);padding-top:var(--s5)}
  .thcards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dklower{grid-template-columns:1fr}
  .dkprog{display:none}
}
@media (max-width:600px){
  .stab{padding:0 10px;font-size:13px;height:38px}
  .dkhead{flex-wrap:wrap;gap:var(--s3)}
  .dkt{flex-basis:100%}
  .dkt h1{font-size:20px}
  .tcols{columns:1}
  .tcard{padding:14px}
  .bbub{height:36px;padding:0 12px;font-size:13px}
  .tpop{width:min(360px, calc(100vw - 24px))}
  .qtime b{font-size:17px}
}

@media (prefers-reduced-motion:reduce){
  .dkbody.swap *,#root.pagein .tcard,#root.pagein .tmts,#root.pagein .tnew,#root.pagein .dklower,.dkprog span,.tpop,html.lh .dialog.builder,.tdchip,.thmore[open] > :not(summary){animation:none !important}
  .stabind,.abprog,.appbar,.thc-win,.qtbar i{transition:none !important}
}
html.lh body:not(.desktop) .sideadd{display:none}
html.lh .children .bbubs{margin-bottom:var(--s3)}

/* screenshots recoloured to the theme (Themes › Card images); the zoomed view shows the original */
html.imgduo .qa img,html.imgduo .bthumb img,html.imgduo .thumbs .thumb img,html.imgduo .bcard img{filter:url(#duo)}
.thgrp ~ .thgrp{margin-top:var(--s6)}
.thsw{display:flex;align-items:center;gap:12px;width:100%;padding:0;border:0;background:none;color:var(--fg);font:500 13px var(--ui);text-align:left;cursor:pointer}
.thsw span{flex:1}
.thsw i{position:relative;width:34px;height:20px;border-radius:10px;background:var(--border-2);flex:none;transition:background var(--t-med)}
.thsw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform var(--t-med) var(--ease)}
.thsw[aria-checked="true"] i{background:var(--accent-btn)}
.thsw[aria-checked="true"] i::after{transform:translateX(14px)}

/* ===================== Recall design system, part 3: layers, structure, the chosen redesigns =====================
   Depth comes from layers, not hairlines: window chrome (darkest in dark themes) holds the sidebar and toolbar,
   the page sits on a raised sheet, cards sit on the sheet, controls sit on cards. */

/* ---------- Frame A: one chrome around a raised sheet ---------- */
html.lh body.desktop{background:var(--side-solid)}
html.lh.win body.desktop,html.lh.win.desktop{background:var(--side-solid) !important}
html.lh body.desktop .toolbar{background:var(--side-solid);border-right:0}
html.lh body.desktop .page{margin:var(--appbar) 8px 8px var(--sidew);min-height:calc(100vh - var(--appbar) - 8px);box-sizing:border-box;border:1px solid var(--border);border-radius:12px;background-color:var(--bg);padding-top:28px;transition:margin-left .25s var(--ease)}
html.lh body.desktop.sidebar-hidden .page{margin-left:8px;padding-top:28px}
html.lh.hosted body.desktop .page{margin-top:calc(var(--appbar) + env(safe-area-inset-top))}
html.lh body.desktop .appbar{background:var(--side-solid);border-bottom:0;padding-right:16px}
html.lh body.desktop .appbar::before,html.lh body.desktop .appbar::after{content:"";position:absolute;bottom:-12px;width:12px;height:12px;pointer-events:none}
html.lh body.desktop .appbar::before{left:0;background:radial-gradient(circle at 100% 100%, transparent 11px, var(--border) 11.5px, var(--border) 12px, var(--side-solid) 12.6px)}
html.lh body.desktop .appbar::after{right:8px;background:radial-gradient(circle at 0 100%, transparent 11px, var(--border) 11.5px, var(--border) 12px, var(--side-solid) 12.6px)}
html.lh body.desktop.sidebar-hidden .appbar::before{left:8px}
.abline{position:absolute;left:12px;right:20px;bottom:-1px;height:1px;background:var(--border);opacity:0;transition:opacity var(--t-med)}
html.scrolled .abline{opacity:1}
.abt{flex:1 1 0}
.abmid{flex:0 1 380px;min-width:180px;position:relative;display:flex;justify-content:center}
.abr{flex:1 1 0;justify-content:flex-end}
.appbar[data-v="study"] .abmid{display:none}
.appbar[data-v="browse"] .abmid{visibility:hidden}
html.lh body.desktop .appbar .sidesearch{order:0;margin:0;width:100%;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--border-2);padding:0 10px;display:flex;align-items:center;gap:8px;-webkit-app-region:no-drag}
html.lh body.desktop .appbar .sidesearch:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent)}
html.lh body.desktop .appbar .sidesearch input{font-size:13px}
html.lh body.desktop .appbar .sidesres{position:absolute;top:38px;left:0;right:0;z-index:40;max-height:60vh;overflow:auto;padding:6px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border-2);box-shadow:0 18px 48px rgba(0,0,0,.4);animation:tp-in .14s var(--ease) both}
html.lh body.desktop .appbar .sidesres .sidelabel{padding:6px 8px 4px}

/* sidebar: rings show how much of a subject you know, the number is what's due */
html.lh body.desktop .toolbar .sidesub .sring{width:16px;height:16px;flex:none}
.sring .rb{fill:none;stroke:var(--border-2);stroke-width:2.5}
.sring .rf{fill:none;stroke:var(--sc);stroke-width:2.5;stroke-linecap:round}
html.lh body.desktop .toolbar .sidesub .ct{color:var(--accent);font-weight:600}
.sidetoday{display:none}
html.lh body.desktop .sidetoday{display:block;order:6;margin-top:auto;padding-top:12px}
html.lh body.desktop .cloudpill{order:7;margin-top:8px}
.stoday{width:100%;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--fg);text-align:left;cursor:pointer;-webkit-app-region:no-drag;transition:border-color var(--t-fast),background var(--t-fast)}
.stoday:hover{border-color:var(--border-2);background:var(--surface-2)}
.stdh{display:flex;justify-content:space-between;font:600 12px var(--ui);color:var(--fg-3)}
.stdn{font:500 13px var(--ui);color:var(--fg-2)}
.stdn b{font:700 24px/1 var(--ui);letter-spacing:-.02em;color:var(--fg);margin-right:6px;font-variant-numeric:tabular-nums}
.stdw{display:flex;gap:4px}
.stdw i{flex:1;height:5px;border-radius:3px;background:var(--border-2)}
.stdw i.on{background:var(--accent-btn)}

/* ---------- subject tabs: a real tab strip with a sliding pill ---------- */
.stabs{display:inline-flex;align-self:flex-start;width:max-content;max-width:100%;align-items:center;gap:2px;padding:4px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin:0 0 var(--s6);border-bottom:1px solid var(--border)}
.stab{height:36px;border-radius:9px;padding:0 14px;z-index:1;background:transparent !important}
.stab:hover{color:var(--fg)}
.stabn{min-width:20px;height:18px;padding:0 6px;border-radius:9px;display:inline-grid;place-items:center;background:rgba(var(--ovr),.07)}
.stab[aria-selected="true"] .stabn{background:color-mix(in srgb, var(--accent) 18%, transparent)}
.stabind{top:4px;bottom:4px;height:auto;border-radius:9px;background:var(--surface-2) !important;box-shadow:0 0 0 1px var(--border-2),inset 0 -2px 0 var(--ic, var(--fg));z-index:0}
.stabadd{height:36px;width:36px;border-radius:9px}

/* ---------- answer reveal: Focus. The answer comes out of a blur while the question steps back ---------- */
html.lh .qa hr.sweep{animation:none}
html.lh .qa .front{transition:opacity .45s var(--ease),transform .45s var(--ease);transform-origin:top left}
html.lh .qa.revealed .front{opacity:.62;transform:scale(.985)}
html.lh .qa.revealed .front:hover{opacity:1;transform:none}
html.lh .qa.justrev .answer{animation:focusin .5s var(--ease) both}
html.lh .qa .answer .sect{animation:none !important}
@keyframes focusin{from{opacity:0;filter:blur(10px);transform:translateY(6px) scale(.99)}}

/* ---------- Browse: list with thumbnails on the left, the card on the right ---------- */
html.lh body.desktop .page.v-browse{padding:0;overflow:hidden;height:calc(100vh - var(--appbar) - 8px);min-height:0}
.brw{display:grid;grid-template-columns:minmax(340px,420px) minmax(0,1fr);height:100%}
.brlist{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--border);background:color-mix(in srgb, var(--bg) 70%, var(--side-solid))}
.brhead{display:flex;flex-direction:column;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--border)}
.brsearch{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--border-2);color:var(--fg-3)}
.brsearch:focus-within{border-color:var(--focus)}
.brsearch svg{width:14px;height:14px;flex:none}
.brsearch input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:400 13px var(--ui);outline:none}
.brfil{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.brdeck,.brsel{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--border-2);background:var(--surface);color:var(--fg);font:500 12px var(--ui);display:inline-flex;align-items:center;gap:6px;cursor:pointer;max-width:200px}
.brdeck.on{background:var(--surface-2);border-color:var(--fg-3)}
.brdeck .pkcar{color:var(--fg-3);font-size:10px}
.brsel{appearance:none;-webkit-appearance:none;padding-right:10px}
.brclr{width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--fg-3);display:grid;place-items:center;cursor:pointer}
.brclr svg{width:10px;height:10px}
.brclr:hover{background:var(--hover);color:var(--fg)}
.brmeta2{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font:500 12px var(--ui);color:var(--fg-3)}
.brmeta2 .grow{flex:1}
.brrows{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:2px}
.brow{display:flex;gap:12px;width:100%;padding:9px;border:0;border-radius:10px;background:transparent;color:var(--fg);text-align:left;cursor:pointer;transition:background var(--t-fast)}
.brow:hover{background:rgba(var(--ovr),.04)}
.brow[aria-selected="true"]{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-2)}
.brow.dragging{opacity:.4}
.brthumb{width:78px;height:56px;flex:none;border-radius:7px;overflow:hidden;background:var(--surface);border:1px solid var(--border);display:block}
.brthumb img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.brthumb.txt{padding:6px 7px;box-sizing:border-box;font:500 8px/1.35 var(--ui);color:var(--fg-3);overflow:hidden}
.brtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.brt1{display:flex;align-items:center;gap:6px;font:600 13px var(--ui)}
.brt1 .rpill{margin-left:auto}
.brq{font:400 13px/1.35 var(--ui);color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brd{display:flex;align-items:center;gap:6px;font:400 12px var(--ui);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brd .sdot2{width:6px;height:6px}
.rpill{height:20px;padding:0 7px;border-radius:10px;display:inline-grid;place-items:center;font:600 11px var(--ui);background:color-mix(in srgb, var(--rp) 16%, transparent);color:var(--rp);flex:none}
.rpill.again{--rp:var(--again)}.rpill.hard{--rp:var(--hard)}.rpill.good{--rp:var(--good)}.rpill.easy{--rp:var(--easy)}.rpill.new{--rp:var(--fg-3)}
.brnone{margin:0;padding:24px 16px;font:400 13px var(--ui);color:var(--fg-3)}
.brprev{min-width:0;overflow-y:auto;display:flex;flex-direction:column}
.brph{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--border)}
.brph .grow{flex:1}
.brcrumb{font:500 13px var(--ui);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
html.lh .brqa{max-width:760px;margin:0;padding:28px 40px 12px;font-size:17px}
.brqa .label{gap:8px}
.brmeta{margin-left:auto;font:400 12px var(--ui);color:var(--fg-3)}
.brqa .bhr{height:1px;border:0;background:var(--border);margin:24px 0 18px}
.brhist{display:flex;gap:6px;flex-wrap:wrap;padding:8px 40px 32px}
.brempty{flex:1;display:grid;place-items:center;color:var(--fg-3);font:400 14px var(--ui)}
@media (max-width:900px){ .brw{grid-template-columns:minmax(0,1fr)} .brprev{display:none} .brlist{border-right:0;background:transparent} html.lh body.desktop .page.v-browse{height:auto;overflow:visible} }

/* ---------- Stats ---------- */
.stx{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s5)}
.stfind{display:flex;align-items:flex-end;gap:var(--s6);padding:6px 0 var(--s5);border-bottom:1px solid var(--border)}
.stfind > div{flex:1}
.steb{font:600 13px var(--ui);color:var(--accent)}
.stfind.bad .steb{color:var(--again)}
.stfind.good .steb{color:var(--good)}
.stfind h1{margin:8px 0 0;font:700 30px/1.15 var(--ui);letter-spacing:-.025em;max-width:820px}
.stkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stk{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.stkl{font:500 13px var(--ui);color:var(--fg-2)}
.stkv{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.stkv b{font:700 32px/1 var(--ui);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stkv small{font:500 14px var(--ui);color:var(--fg-3)}
.stkv svg{width:96px;height:30px;flex:none}
.stkv path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stkd{font:500 12px var(--ui)}
.stmain{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--s4);align-items:start}
.stleft{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.stcard{padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.sth{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sth h2,.stright h2{margin:0;font:600 15px var(--ui)}
.stheat{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.stheat i{border-radius:3px;background:var(--surface-2)}
.stheat i.hm1{background:color-mix(in srgb, var(--accent-btn) 28%, var(--surface-2))}
.stheat i.hm2{background:color-mix(in srgb, var(--accent-btn) 50%, var(--surface-2))}
.stheat i.hm3{background:color-mix(in srgb, var(--accent-btn) 75%, var(--surface-2))}
.stheat i.hm4{background:var(--accent-btn)}
.stmonths{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));font:500 11px var(--ui);color:var(--fg-3)}
.sttabs{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);align-self:flex-start;flex-wrap:wrap}
.sttabs button{height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--fg-2);font:500 13px var(--ui);display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.sttabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--border-2)}
.sttabs .sdot2{width:7px;height:7px}
.stmast{display:flex;flex-direction:column;gap:6px}
.stmrow{display:flex;flex-direction:column;gap:7px;padding:10px;margin:0 -10px;border:0;border-radius:8px;background:transparent;color:var(--fg);text-align:left;cursor:pointer}
.stmrow:hover{background:rgba(var(--ovr),.04)}
.stmn{display:flex;align-items:center;gap:8px;font:500 14px var(--ui)}
.stmn .grow{flex:1}
.stbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);gap:2px}
.stbar i{display:block;height:100%}
.stbar i.k,.stlegend i.k{background:var(--good)}
.stbar i.l,.stlegend i.l{background:var(--hard)}
.stlegend{display:flex;gap:16px;font:500 12px var(--ui);color:var(--fg-2)}

  });

function browseClick(id, e){
  if (!id || !S.cards[id]) return;

    const a = ids.indexOf(browse.anchor || browse.sel), b = ids.indexOf(id); if (a < 0 || b < 0) return browseSelect(id);

document.addEventListener('keydown', e => {

/* ---------- stats ---------- */
function calibrationHtml(){
  const revs = Object.values(S.cards).flatMap(c => (c.revs || []).filter(r => r.cf != null));
  if (!revs.length) return `<div class="panel"><h2>Confidence vs. reality</h2><p class="sub" style="margin:0">Set your confidence before revealing answers (Harness layout) and this shows whether your gut feeling matches how well you really know things.</p></div>`;
  const B = [[0, 20], [20, 40], [40, 60], [60, 80], [80, 101]].map(([a, b]) => { const rs = revs.filter(r => r.cf >= a && r.cf < b); return { l: b > 100 ? '80–100%' : `${a}–${b}%`, n: rs.length, ok: rs.length ? Math.round(rs.filter(r => r.r >= 3).length / rs.length * 100) : null, mid: Math.min(90, a + 10) }; });
  const hi = B[4], over = hi.n >= 3 && hi.ok < 70;
  return `<div class="panel"><h2>Confidence vs. reality</h2><p class="sub" style="margin:-6px 0 12px">For each confidence level you chose, how often you then rated the card Good or Easy. Close to the dotted line means your confidence is well calibrated. ${hi.n >= 3 ? (over ? `<b>When you feel 80%+ sure you only know it ${hi.ok}% of the time</b>, so slow down on those.` : `When you feel 80%+ sure you're right ${hi.ok}% of the time.`) : ''}</p>
    <div class="calib">${B.map(b => `<div class="cb" title="${b.n} review${b.n === 1 ? '' : 's'}"><div class="cbar"><i class="target" style="bottom:${b.mid}%"></i>${b.ok != null ? `<span style="height:${b.ok}%"></span><b>${b.ok}%</b>` : ''}</div><small>${b.l}</small><em>${b.n}×</em></div>`).join('')}</div></div>`;
}
/* ---------- stats: one finding, four numbers, a year of study days, per-subject detail, and what to fix ---------- */
let statScope = '';
function streakDays(log){ let n = 0, t = today0(); if (!(log[dayKey(t + HOUR * 2)] > 0)) t -= DAY; while (log[dayKey(t + HOUR * 2)] > 0){ n++; t -= DAY; } return n; }
function sparkPath(vals, w = 96, h = 30){ const mx = Math.max(1, ...vals); return vals.map((v, i) => (i ? 'L' : 'M') + (i * w / (vals.length - 1)).toFixed(1) + ' ' + (h - 2 - v / mx * (h - 4)).toFixed(1)).join(' '); }
const fmtDur = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0'); };
function statFinding(cs){
  const since = Date.now() - 7 * DAY, by = new Map();
  cs.forEach(c => (c.revs || []).forEach(r => { if (r.t >= since && r.r === 1){ const k = c.nodeId; const v = by.get(k) || { n: 0, last: 0 }; v.n++; v.last = Math.max(v.last, r.t); by.set(k, v); } }));
  let best = null; by.forEach((v, k) => { if (nodeOf(k) && (!best || v.n > best.n)) best = { id: k, ...v }; });
  if (best && best.n >= 2) return { tone: 'bad', eyebrow: 'This week', text: `${esc(nodeOf(best.id).name)} is slipping. You've pressed Again on it ${best.n} times in the last 7 days.`, act: `<button class="btn primary big" data-act="practise-forgot" data-id="${esc(best.id)}">Practise ${esc(nodeOf(best.id).name)}</button>` };
  const st = streakDays(reviewLog());
  if (st >= 2) return { tone: 'good', eyebrow: 'Keep it going', text: `${st} days in a row. Nothing is slipping this week.`, act: '' };
  const due = toStudy(counts(statScope || null));
  return { tone: 'plain', eyebrow: 'Today', text: due ? `${due} card${due === 1 ? '' : 's'} waiting. A short session today keeps them from piling up.` : 'Nothing due right now. Add the mistakes from your last test while they are fresh.', act: due ? `<button class="btn primary big" data-act="study" data-id="${esc(statScope)}">Study ${due}</button>` : '' };
}
function renderStats(){
  if (statScope && !S.nodes[statScope]) statScope = '';
  const all = Object.values(S.cards), cs = statScope ? cardsIn(statScope) : all, log = reviewLog(), t0 = today0(), ws = weekStart(), now = Date.now();
  const revs = cs.flatMap(c => (c.revs || []).map(r => ({ ...r, c })));
  const dayN = t => log[dayKey(t + HOUR * 2)] || 0;
  const last7 = [...Array(7)].map((_, i) => t0 - (6 - i) * DAY);
  const wk = reviewsThisWeek(), lastWk = reviewsBetween(ws - 7 * DAY, ws);
  const r30 = revs.filter(r => r.t >= now - 30 * DAY), rem = r30.length ? Math.round(r30.filter(r => r.r > 1).length / r30.length * 100) : null;
  const remDays = last7.map(t => { const rs = revs.filter(r => r.t >= t && r.t < t + DAY); return rs.length ? rs.filter(r => r.r > 1).length / rs.length : 0; });
  const msWeek = revs.filter(r => r.t >= ws && r.ms).reduce((a, r) => a + r.ms, 0);
  const msDays = last7.map(t => revs.filter(r => r.t >= t && r.t < t + DAY && r.ms).reduce((a, r) => a + r.ms, 0));
  const streak = streakDays(log);
  const kpis = [
    { l: 'Reviews this week', v: String(wk), u: '', d: wk === lastWk ? 'Same as last week' : (wk > lastWk ? '+' : '−') + Math.abs(wk - lastWk) + ' on last week', c: 'var(--accent)', s: last7.map(dayN) },
    { l: 'Remembered', v: rem == null ? '–' : String(rem), u: rem == null ? '' : '%', d: 'Last 30 days, not Again', c: 'var(--good)', s: remDays },
    { l: 'Time studying', v: msWeek ? fmtDur(msWeek) : '–', u: '', d: 'This week, with the timer data', c: 'var(--easy)', s: msDays },
    { l: 'Streak', v: String(streak), u: streak === 1 ? ' day' : ' days', d: streak ? 'Days in a row' : 'Study today to start one', c: 'var(--hard)', s: last7.map(t => dayN(t) ? 1 : 0) }
  ];
  const f = statFinding(cs);
  // a year of study days
  const start = t0 - (52 * 7 + ((new Date(t0).getDay() + 6) % 7)) * DAY, cells = [];
  let mx = 1; for (let t = start; t <= t0; t += DAY) mx = Math.max(mx, dayN(t));
  for (let t = start; t <= t0; t += DAY){ const n = dayN(t), lv = n ? Math.min(4, Math.ceil(n / mx * 4)) : 0; cells.push(`<i class="hm${lv}" title="${new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}: ${n} review${n === 1 ? '' : 's'}"></i>`); }
  const months = [...Array(12)].map((_, i) => new Date(new Date(t0).getFullYear(), new Date(t0).getMonth() - 11 + i, 1).toLocaleDateString(undefined, { month: 'short' }));
  const studied = Object.values(log).filter(n => n > 0).length;
  // per subject / per topic

  const subjects = kids(null);
  const scopeTabs = `<div class="sttabs" role="tablist" aria-label="Subject">${[['', 'All subjects'], ...subjects.map(s => [s.id, s.name])].map(([id, nm]) => `<button role="tab" aria-selected="${statScope === id}" data-act="stat-scope" data-id="${esc(id)}" ${id ? `style="--sc:${scol(id)}"` : ''}>${id ? '<span class="sdot2"></span>' : ''}${esc(nm)}</button>`).join('')}</div>`;
  let detail;
  if (!statScope){
    detail = `<div class="stmast">${subjects.map(s => { const sc = cardsIn(s.id), n = sc.length || 1, k = sc.filter(known).length, l = sc.filter(learning).length; return `<button class="stmrow" data-act="stat-scope" data-id="${s.id}"><span class="stmn"><span class="sdot2" style="--sc:${scol(s.id)}"></span>${esc(s.name)}<span class="grow"></span><span class="sub">${k} of ${sc.length} known</span></span><span class="stbar"><i class="k" style="width:${k / n * 100}%"></i><i class="l" style="width:${l / n * 100}%"></i></span></button>`; }).join('') || '<p class="sub">No subjects yet.</p>'}</div>
      <div class="stlegend"><span><i class="k"></i>Known</span><span><i class="l"></i>Learning</span><span><i></i>Not seen</span></div>`;
  } else {
    const n = cs.length || 1, k = cs.filter(known).length, l = cs.filter(learning).length, C = 2 * Math.PI * 70;

    const topics = kids(statScope).filter(t => cardsIn(t.id).length);
    detail = `<div class="stsubj" style="--sc:${scol(statScope)}">
        <div class="stdonut"><svg viewBox="0 0 180 180" role="img" aria-label="${k} known, ${l} learning, ${cs.length - k - l} not seen"><circle cx="90" cy="90" r="70" class="dbg"/><circle cx="90" cy="90" r="70" class="dk" stroke-dasharray="${(k / n * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 90 90)"/><circle cx="90" cy="90" r="70" class="dl" stroke-dasharray="${(l / n * C).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-k / n * C).toFixed(1)}" transform="rotate(-90 90 90)"/><text x="90" y="90" class="dv">${Math.round(k / n * 100)}%</text><text x="90" y="112" class="dt">known</text></svg>
          <div class="stdl"><span><b class="k">${k}</b>Known</span><span><b class="l">${l}</b>Learning</span><span><b>${cs.length - k - l}</b>Not seen</span></div></div>

      ${topics.length ? `<div class="sttable"><div class="sttr sthd"><span>Topic</span><span>Cards</span><span>Known</span><span>Due</span><span>Again rate</span></div>${topics.map(t => { const tc = cardsIn(t.id), tk = tc.filter(known).length, tr = tc.flatMap(c => c.revs || []), ag = tr.length ? Math.round(tr.filter(r => r.r === 1).length / tr.length * 100) : null; return `<button class="sttr" data-act="open" data-id="${t.id}"><span>${esc(t.name)}</span><span>${tc.length}</span><span class="stmini"><i style="width:${tc.length ? tk / tc.length * 100 : 0}%"></i></span><span class="due">${toStudy(counts(t.id)) || '–'}</span><span class="${ag > 25 ? 'bad' : ''}">${ag == null ? '–' : ag + '%'}</span></button>`; }).join('')}</div>` : ''}`;
  }
  const forgot = cs.map(c => ({ c, n: rateCount(c, 1) || (c.srs?.lapses || 0) })).filter(x => x.n > 0).sort((a, b) => b.n - a.n || lastMissed(b.c) - lastMissed(a.c));
  const fixHtml = forgot.length ? `<div class="glist plain">${forgot.slice(0, 8).map(({ c, n }) => { const lm = lastMissed(c); return `<button class="glrow" data-act="study-one" data-id="${c.id}"><span class="gldot" style="background:${scol(c.nodeId)}"></span><span class="gln"><span>${esc(pathOf(c.nodeId).slice(-1)[0]?.name || '')}${c.label ? ' · ' + esc(c.label) : ''}</span><small>${lm ? 'Last missed ' + dayWord(lm) : 'Missed ' + n + ' times'}${isLeech(c) ? ' · leech' : ''}</small></span><span class="glx">×${n}</span></button>`; }).join('')}</div>` : `<p class="glnone">Nothing to fix yet. Cards you press Again on show up here, worst first.</p>`;
  $('#root').innerHTML = `<div class="stx">

/* ---------- Windows: Ctrl instead of ⌘ in every hint, and a title bar that matches the theme ---------- */
function winKeys(root){
  const fix = t => t.replace(/⇧⌘/g, 'Ctrl+Shift+').replace(/⌘/g, 'Ctrl+').replace(/⇧/g, 'Shift+').replace(/⌥/g, 'Alt+').replace(/Ctrl\/Ctrl\+/g, 'Ctrl+').replace(/Ctrl\+\s/g, 'Ctrl+');
  const walk = n => {
    if (n.nodeType === 3){ if (/[⌘⇧⌥]/.test(n.nodeValue) && !n.parentElement?.closest('[contenteditable],textarea,input')) n.nodeValue = fix(n.nodeValue); return; }

    for (const a of ['title', 'aria-label', 'placeholder']){ const v = n.getAttribute?.(a); if (v && /[⌘⇧⌥]/.test(v)) n.setAttribute(a, fix(v)); }
    n.childNodes.forEach(walk);
  };
  walk(root);
}
function winSetup(){

}
