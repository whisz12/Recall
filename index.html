<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recall">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script>window.RECALL_HOSTED = true; window.RECALL_BUILD = "20261031184641";
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
if (innerWidth >= 900) document.documentElement.classList.add('desktop', 'hosted');</script>
</head>
<body>
<title>Recall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: brand + pill nav; deck screen = quiet summary tiles, then one card per subject holding its topic/subtopic tree; study = question on a card surface, answer slides in below a divider, tinted answer buttons in a bottom bar. Calm slate dark, colour only where it carries meaning. */
:root{
  color-scheme: dark;
  --bg:#14161b; --surface:#1c1f26; --surface-2:#232731; --hover:#2a2f3a; --inset:#171a20;
  --border:#2a2f39; --border-2:#363c48;
  --fg:#e7e9ef; --fg-2:#aab0bf; --fg-3:#767d8d; --zero:#454b57;
  --accent:#9aa6ff; --accent-btn:#6b6bf5;
  --new:#62a8ff; --learn:#ff7a85; --review:#3ddc84;
  --again:#ff6f7d; --hard:#ffa257; --good:#4fdc8f; --easy:#62b4ff;
  --mistake:#ff7d8c; --solution:#6ff0a8;
  --ovr:255,255,255; --fg-hi:#fff; --btn-fg:#fff; --bar:rgba(20,22,27,.86); --side:rgba(18,20,25,.55); --glow:rgba(142,156,240,.09);
  --qa-bg:#1c1f26; --qa-fg:#e7e9ef;
  --mk-bg:#3a2754; --mk-b:#6d4a8c; --mk-fg:#fff; --so-bg:#12514f; --so-b:#23877c; --so-fg:#f2fbf7; --ex-bg:#17375a; --ex-b:#2d6aa6; --ex-t:#8ecbff; --ex-fg:#eef6ff;
  --focus:#8e9cf0;
  --ui:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --card:"Source Serif 4", Charter, "Iowan Old Style", Georgia, serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --side-font:"Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(1000px 420px at 50% -160px, var(--glow), transparent 70%);background-repeat:no-repeat;color:var(--fg);font-family:var(--ui);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}

/* toolbar */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.toolbar .tin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:13px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.015em;line-height:1;border:0;background:none;padding:2px 0;color:var(--fg)}
.brand .logo{width:28px;height:28px;flex:none;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(var(--ovr),.06)}
.brand:hover span{color:var(--fg-hi)}
.brand i{width:24px;height:24px;border-radius:7px;background:linear-gradient(150deg,#7d8be6,#5b67c9);display:grid;place-items:center;font-style:normal;font-family:var(--card);font-size:14px;color:#fff}
.toolbar nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.toolbar nav button{border:0;background:transparent;color:var(--fg-2);padding:6px 13px;border-radius:999px;font-size:13.5px;font-weight:500}
.toolbar nav button:hover{color:var(--fg);background:var(--hover)}
.toolbar nav button[aria-current="true"]{color:var(--fg);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-2)}

.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 90px}
.narrow{max-width:780px;margin:0 auto}
.wide{max-width:1100px;margin:0 auto}

/* buttons */
.btn{background:var(--surface-2);border:1px solid var(--border-2);border-radius:9px;padding:7px 14px;color:var(--fg);font-size:13.5px;font-weight:500;line-height:1.3;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent-btn);border-color:transparent;color:var(--btn-fg)}
.btn.primary:hover{background:color-mix(in srgb, var(--accent-btn) 86%, #fff)}
.btn.big{padding:10px 22px;font-size:14.5px;border-radius:11px}
.btn.danger{color:color-mix(in srgb, var(--again) 70%, var(--fg));border-color:color-mix(in srgb, var(--again) 35%, var(--surface))}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.link{border:0;background:none;color:var(--fg-2);padding:3px 6px;border-radius:6px;font-size:13px}
.link:hover{color:var(--fg);background:var(--hover)}
.icon{width:30px;height:30px;border:0;background:transparent;border-radius:8px;color:var(--fg-3);display:inline-grid;place-items:center}
.icon:hover{background:var(--hover);color:var(--fg)}
.icon svg{width:16px;height:16px}

/* deck screen */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hello h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.hello p{margin:0;color:var(--fg-2);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.tile span{font-size:12.5px;color:var(--fg-3)}
.colhead,.drow{display:grid;grid-template-columns:minmax(0,1fr) 46px 46px 46px 34px;align-items:center;gap:2px}
.colhead{padding:0 12px 6px;font-size:11.5px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em}
.colhead span:not(:first-child),.drow .num{text-align:right;padding-right:6px}
.subject{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden}
.subject .shead{padding:12px 12px 10px;border-bottom:1px solid var(--border)}
.subject .shead .dlink{font-size:15.5px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none;margin:0 6px 0 4px;box-shadow:0 0 0 3px color-mix(in srgb, var(--sc) 18%, transparent)}
.prog{height:3px;background:var(--inset);border-radius:3px;overflow:hidden;margin:9px 34px 0 31px;display:flex}
.prog span{height:100%}
.drow{padding:5px 12px;border-radius:0}
.subject .rows{padding:4px 0 6px}
.subject .rows .drow:hover{background:var(--surface-2)}
.dname{display:flex;align-items:center;gap:2px;min-width:0}
.caret{width:22px;height:22px;border:0;background:none;color:var(--fg-3);flex:none;padding:0;display:grid;place-items:center;border-radius:6px}
.caret:hover{color:var(--fg);background:var(--hover)}
.caret svg{width:10px;height:10px;transition:transform .15s}
.caret[aria-expanded="true"] svg{transform:rotate(90deg)}
.caret.blank{visibility:hidden}
.dlink{border:0;background:none;color:var(--fg);padding:2px 4px;border-radius:5px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dlink:hover{color:var(--fg-hi);text-decoration:underline;text-decoration-color:var(--fg-3);text-underline-offset:3px}
.cnt{color:var(--fg-3);font-size:12px;margin-left:4px;flex:none}
.num{font-variant-numeric:tabular-nums;font-size:13.5px}
.n-new{color:var(--new)} .n-learn{color:var(--learn)} .n-due{color:var(--review)}
.zero{color:var(--zero)}
.deckfoot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}


/* home */
.htop{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:4px 0 20px}
.date{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.sum{margin:4px 0 0;font-size:17px;color:var(--fg-2)}
.sum .sep{margin:0 10px;color:var(--fg-3)}
.chev.sm{width:24px;height:24px;margin-left:-6px}
.chev.sm svg{width:9px;height:9px}
.topic.is-collapsed{padding-bottom:8px}
.sum b{color:var(--fg);font-weight:700}
.subj{background:linear-gradient(180deg, color-mix(in srgb, var(--sc) 7%, var(--surface)), var(--surface) 140px);border:1px solid color-mix(in srgb, var(--sc) 18%, var(--border));border-radius:18px;padding:16px 18px 14px;margin-bottom:14px}
.shd{display:flex;align-items:center;gap:12px}
.mono{width:42px;height:42px;border-radius:12px;border:0;background:color-mix(in srgb, var(--sc) 24%, transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--sc) 35%, transparent);color:var(--sc);font-weight:800;font-size:17px;display:grid;place-items:center;flex:none;transition:transform .15s}
.mono:hover{background:color-mix(in srgb, var(--sc) 26%, transparent)}
.mono[aria-expanded="false"]{opacity:.7}
.sname{display:flex;flex-direction:column;min-width:0}
.sname .h2{border:0;background:none;padding:0;text-align:left;font-size:17.5px;font-weight:700;letter-spacing:-.01em;color:var(--fg)}
.sname .h2:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--fg-3)}
.sname .meta{font-size:12.5px;color:var(--fg-3)}
.grow{flex:1}
.btn.tint{background:color-mix(in srgb, var(--sc) 16%, transparent);border-color:color-mix(in srgb, var(--sc) 40%, transparent);color:var(--sc);font-weight:600}
.btn.tint:hover{background:color-mix(in srgb, var(--sc) 24%, transparent)}
.icon.soft{opacity:.55}
.icon.soft:hover,.icon.soft:focus-visible{opacity:1}
.prog2{height:4px;border-radius:3px;background:var(--inset);margin:14px 0 4px;display:flex;overflow:hidden}
.prog2 span{height:100%;background:var(--sc)}
.topics{display:flex;flex-direction:column;margin-top:6px}
.topic{padding:10px 4px 10px 6px;border-top:1px solid var(--border)}
.topic:first-child{border-top:0}
.trow{display:flex;align-items:center;gap:8px;min-width:0}
.tname{border:0;background:none;padding:0;color:var(--fg);font-weight:600;font-size:14.5px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tname:hover{color:var(--fg-hi);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--fg-3)}
.trow .n,.chip .n{color:var(--fg-3);font-size:12px;font-variant-numeric:tabular-nums}
.pill-s{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:color-mix(in srgb, var(--sc) 18%, transparent);color:var(--sc);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.chip{border:1px solid var(--border-2);background:var(--inset);border-radius:999px;padding:8px 16px;font-size:14.5px;font-weight:500;color:color-mix(in srgb, var(--fg) 85%, var(--bg));display:inline-flex;gap:8px;align-items:center;max-width:100%;min-width:0;transition:border-color .12s,color .12s,background .12s}
.chip:hover{border-color:color-mix(in srgb, var(--tc) 65%, transparent);color:var(--fg);background:color-mix(in srgb, var(--tc) 6%, var(--inset))}
.chip:focus-visible{outline:2px solid var(--tc);outline-offset:2px}
.chip .cname{min-width:0;overflow-wrap:anywhere;text-align:left}
.chip .n{font-size:13.5px;color:var(--fg-3);font-variant-numeric:tabular-nums;flex:none}
.chip .cemoji{font-size:15px;line-height:1;flex:none}
.chip.zero-chip{opacity:.55}
.cdot{width:7px;height:7px;border-radius:50%;background:var(--tc);display:inline-block;flex:none}
.tbigs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.tbig{flex:1 1 220px;max-width:340px;min-width:0;text-align:left;border:1px solid var(--border-2);background:var(--inset);border-radius:18px;padding:13px 16px 14px;display:flex;flex-direction:column;gap:10px;color:var(--fg);transition:border-color .12s,background .12s}
.tbig:hover{border-color:color-mix(in srgb, var(--tc) 65%, transparent);background:color-mix(in srgb, var(--tc) 6%, var(--inset))}
.tbig:focus-visible{outline:2px solid var(--tc);outline-offset:2px}
.tbig.is-empty{opacity:.55}
.tb-top{display:flex;align-items:center;gap:8px;min-height:24px}
.tb-due{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb, var(--tc) 20%, transparent);color:var(--tc);white-space:nowrap}
.tb-name{font-size:16px;font-weight:650;line-height:1.3;overflow-wrap:anywhere}
.tb-foot{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--fg-2)}
.tb-n{white-space:nowrap}
.none{margin:12px 0 2px;color:var(--fg-3);font-size:13px}
.hfoot{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:18px}
@media (max-width:760px){ .subj{padding:14px 14px 12px} .shd{gap:10px} .mono{width:36px;height:36px} }


/* home v3: review chips, collapsible subjects, subtopic tiles */
.revchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.revchips span{font-size:12.5px;color:var(--fg-2);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 11px}
.revchips b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.hact{display:flex;align-items:center;gap:10px}
.mono.has-emoji{font-size:21px}
.sname .h2{cursor:pointer}
.sname .meta b{color:var(--sc);font-weight:700}
.chev{width:30px;height:30px;border:0;background:transparent;border-radius:8px;color:var(--fg-3);display:grid;place-items:center;flex:none}
.chev:hover{background:var(--hover);color:var(--fg)}
.chev svg{width:11px;height:11px;transform:rotate(90deg);transition:transform .2s}
.chev[aria-expanded="false"] svg{transform:rotate(0)}
.subj.is-collapsed{padding-bottom:12px}
.subj.is-collapsed .prog2{margin-bottom:0}
.temoji{font-size:16px;line-height:1}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:44px;grid-auto-flow:row dense;gap:10px;margin-top:12px}
.stile{position:relative;text-align:left;border:1px solid color-mix(in srgb, var(--tc) 26%, transparent);background:color-mix(in srgb, var(--tc) 8%, var(--inset));border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;color:var(--fg);overflow:hidden;min-width:0;transition:transform .15s ease, border-color .15s ease, background .15s ease}
.stile:hover{transform:translateY(-1px);border-color:color-mix(in srgb, var(--tc) 55%, transparent);background:color-mix(in srgb, var(--tc) 14%, var(--inset))}
.stile:focus-visible{outline:2px solid var(--tc);outline-offset:2px}
.stile.sz-s{grid-row:span 1;border-radius:999px;padding:0 14px;flex-direction:row;align-items:center}
.stile.sz-m{grid-row:span 2}
.stile.sz-l{grid-row:span 2;grid-column:span 2}
.stile.sz-xl{grid-row:span 3;grid-column:span 2;border-radius:22px;padding:16px 18px;background:color-mix(in srgb, var(--tc) 12%, var(--surface-2));border-color:color-mix(in srgb, var(--tc) 34%, transparent)}
.stile.sz-xl .st-name{font-size:18px;font-weight:700}
.st-top{display:flex;align-items:center;gap:8px;min-width:0;padding-right:52px;width:100%}
.sz-s .st-top{padding-right:0}
.sz-s .st-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.st-n{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.st-emoji{font-size:18px;line-height:1}
.st-tag{flex:none;font-size:11px;font-weight:800;letter-spacing:.04em;padding:5px 8px;border-radius:8px;background:color-mix(in srgb, var(--tc) 22%, transparent);color:var(--tc)}
.st-name{font-size:14.5px;font-weight:600;line-height:1.3;letter-spacing:-.005em;min-width:0}
.st-due{position:absolute;top:11px;right:11px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb, var(--tc) 22%, transparent);color:var(--tc)}
.sz-s .st-due{position:static;margin-left:6px}
.st-foot{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fg-2)}
.st-bar{flex:1;height:4px;border-radius:4px;background:rgba(var(--ovr),.07);overflow:hidden;min-width:30px}
.st-bar i{display:block;height:100%;background:var(--tc);border-radius:4px;opacity:.85}
.stile.is-empty{opacity:.5}
.srow{display:flex;align-items:center;gap:0}
.srow .sideitem{flex:1;min-width:0}
.srow .caret{width:20px;height:20px}
.sidehead{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.sidehead .link{font-size:12px;text-transform:none;letter-spacing:0;font-weight:500}
.sideitem .sdot{width:7px;height:7px;margin-right:4px;flex:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--border-2);background:var(--inset);border-radius:9px;padding:6px 12px;font-size:13px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:color-mix(in srgb, var(--accent) 12%, transparent)}
.semoji{width:16px;text-align:center;font-size:14px;line-height:1}
.tile b small{font-size:13px;color:var(--fg-3);font-weight:500}
/* customise dialog */
.cprev{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid color-mix(in srgb, var(--tc) 35%, transparent);background:linear-gradient(150deg, color-mix(in srgb, var(--tc) 24%, var(--surface-2)), color-mix(in srgb, var(--tc) 6%, var(--surface)));font-weight:700;font-size:16px}
.cprev .cg{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb, var(--tc) 28%, transparent);color:var(--tc);font-size:20px;font-weight:800}
.iconrow,.swrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.icopt{width:36px;height:36px;border-radius:10px;border:1px solid var(--border-2);background:var(--inset);font-size:17px;display:grid;place-items:center;padding:0}
.icopt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 15%, transparent)}
.icin{width:64px !important;text-align:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.sw.auto{width:auto;padding:0 10px;border-radius:999px;background:transparent;border:1px dashed var(--border-2);color:var(--fg-2);font-size:12px;box-shadow:none}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.sw.auto[aria-pressed="true"]{border:1px solid var(--fg);color:var(--fg)}

/* progress filters */
.filters,.rbreak{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters{margin:0 0 10px}
.fsep{width:1px;height:18px;background:var(--border-2);margin:0 4px}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-2);background:var(--inset);color:var(--fg-2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500}
.fchip span{color:var(--fg-3);font-variant-numeric:tabular-nums}
.fchip:hover:not(:disabled){color:var(--fg);border-color:var(--fg-3)}
.fchip[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent)}
.fchip:disabled{opacity:.4;cursor:default}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--surface-2);border:1px solid var(--border-2);border-radius:10px;padding:8px 14px;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.45);max-width:calc(100% - 32px)}

  const row = e.target.closest?.('tr[data-card]');
  if (row){ dragCard = row.dataset.card; e.dataTransfer.effectAllowed = 'copyMove'; e.dataTransfer.setData('text/plain', dragCard); setTimeout(() => row.classList.add('dragging'), 0); return; }
  const el = e.target.closest?.('[draggable="true"][data-id]'); if (!el) return;
  dragId = el.dataset.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
  setTimeout(() => el.classList.add('dragging'), 0); closeMenu();
});
document.addEventListener('dragend', () => { dragId = null; dragCard = null; document.querySelectorAll('.dragging, .dropok').forEach(x => x.classList.remove('dragging', 'dropok')); });
document.addEventListener('dragover', e => {
  if (dragCard){
    const el = cardDropEl(e.target), ref = cardDropRef(el), c = S.cards[dragCard];
    document.querySelectorAll('.dropok').forEach(x => { if (x !== el) x.classList.remove('dropok'); });
    if (!el || !ref || !c || !nodeOf(ref) || ref === homeRef(c) || (ref === c.nodeId && !String(ref).includes('::'))) return;
    e.preventDefault(); e.dataTransfer.dropEffect = e.altKey ? 'copy' : 'move'; el.classList.add('dropok'); return;
  }
  if (!dragId) return;
  const el = e.target.closest('[data-drop], .chip[data-id], .tbig[data-id]');
  document.querySelectorAll('.dropok').forEach(x => { if (x !== el) x.classList.remove('dropok'); });
  const t = moveTargetOf(el); if (!t || (t.onto && t.onto === dragId)) return;
  const sn = nodeOf(dragId), host = sn?.virtual && t.onto ? t.onto : t.host;
  if (!canMove(dragId, host) && !(!sn?.virtual && t.onto && (sn.parentId || null) === (host || null))) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move'; el.classList.add('dropok');
});
document.addEventListener('drop', async e => {
  if (dragCard){
    const el = cardDropEl(e.target), ref = cardDropRef(el), id = dragCard; dragCard = null;
    document.querySelectorAll('.dropok, .dragging').forEach(x => x.classList.remove('dropok', 'dragging'));
    if (!ref || !nodeOf(ref) || !S.cards[id]) return; e.preventDefault();
    if (e.altKey){ const n = await linkCards([id], ref); render(); return toast(n ? `Also showing it in ${refName(ref)}` : 'It’s already there'); }
    await moveCardFrom(id, view.name === 'browse' ? browse.node : null, ref); render(); return toast(`Moved to ${refName(ref)} · ⌘Z to undo`);
  }
  if (!dragId) return;
  const el = e.target.closest('[data-drop], .chip[data-id], .tbig[data-id]'), t = moveTargetOf(el), src = dragId;
  document.querySelectorAll('.dropok').forEach(x => x.classList.remove('dropok')); dragId = null;
  if (!t || t.onto === src) return; e.preventDefault();
  const sn = nodeOf(src);
  if (sn?.virtual) return doMove(src, t.onto || t.host, null);
  if (t.onto && (sn.parentId || null) === (t.host || null)) return moveNode(src, t.host, t.before).then(() => { render(); toast('Reordered'); });
  return doMove(src, t.host, t.before);
});

/* ---------- deck picker: searchable, collapsible tree of decks and bubbles (tick boxes or single choice) ---------- */
function pkMount(host, o){
  // o: { multi, sel: Set, bubbles, disabled(id), onPick(id, on), extra: [{id,label}] }
  o.open = o.open || new Set(); o.q = '';
  o.sel.forEach(id => { const ps = pathOf(id).filter(n => !n.virtual); (String(id).includes('::') ? ps : ps.slice(0, -1)).forEach(n => o.open.add(n.id)); });
  host.innerHTML = `<div class="pksearch"><input class="in" type="search" placeholder="Search decks" aria-label="Search decks"></div><div class="pklist" role="tree"></div>`;
  const list = host.querySelector('.pklist'), search = host.querySelector('input');
  const match = () => {
    const q = o.q.trim().toLowerCase(); if (!q) return null;
    const m = new Set();
    Object.values(S.nodes).forEach(n => { const hit = n.name.toLowerCase().includes(q) || typesOf(n.id).some(t => t.name.toLowerCase().includes(q)); if (hit) pathOf(n.id).forEach(a => m.add(a.id)); });
    return m;
  };
  const row = (id, label, d, has, open, bubble) => {
    const dis = o.disabled?.(id), on = o.sel.has(id), n = cardsIn(id).length;
    return `<div class="pkrow ${dis ? 'off' : ''} ${on ? 'on' : ''}" style="padding-left:${6 + d * 18}px"><button type="button" class="caret ${has ? '' : 'blank'}" data-pk-tog="${esc(id)}" aria-expanded="${open}" aria-label="${open ? 'Collapse' : 'Expand'} ${esc(label)}">${I.caret}</button><label><input type="${o.multi ? 'checkbox' : 'radio'}" name="pk${o.uid}" data-pk="${esc(id)}" ${on ? 'checked' : ''} ${dis ? 'disabled' : ''}><span class="pkl">${esc(label)}</span>${bubble ? '<span class="pkb">bubble</span>' : ''}<span class="pkn">${n}</span></label></div>`;
  };
  const draw = () => {
    const m = match(), q = o.q.trim().toLowerCase();
    const rows = (pid, d) => kids(pid).map(n => {
      if (m && !m.has(n.id)) return '';
      const ts = o.bubbles ? typesOf(n.id) : [], ch = kids(n.id), has = ch.length || ts.length, open = m ? true : o.open.has(n.id);
      const tsv = m ? ts.filter(t => t.name.toLowerCase().includes(q) || n.name.toLowerCase().includes(q)) : ts;
      return row(n.id, n.name, d, has, open, false) + (open ? tsv.map(t => row(n.id + '::' + t.k, t.name, d + 1, false, false, true)).join('') + rows(n.id, d + 1) : '');
    }).join('');
    const extra = (o.extra || []).map(x => row(x.id, x.label, 0, false, false, false)).join('');
    list.innerHTML = extra + rows(null, 0) || '<p class="hint" style="padding:10px">No decks match.</p>';
  };
  o.uid = o.uid || Math.random().toString(36).slice(2, 7);
  list.addEventListener('click', e => { const t = e.target.closest('[data-pk-tog]'); if (!t) return; e.preventDefault(); const id = t.dataset.pkTog; o.open.has(id) ? o.open.delete(id) : o.open.add(id); draw(); });
  list.addEventListener('change', e => { const i = e.target.closest('[data-pk]'); if (!i) return; const id = i.dataset.pk;
    if (o.multi){ i.checked ? o.sel.add(id) : o.sel.delete(id); } else { o.sel.clear(); o.sel.add(id); }
    o.onPick?.(id, i.checked); if (host.isConnected) draw(); });
  search.addEventListener('input', () => { o.q = search.value; draw(); });
  search.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); } });
  draw();
  return { redraw: draw, focus: () => search.focus() };
}
function closePicker(){ document.querySelectorAll('.pickpop').forEach(p => p.remove()); document.querySelectorAll('.pickbtn[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false')); }
function openPicker(btn, o){
  const was = btn.getAttribute('aria-expanded') === 'true'; closePicker(); if (was) return;
  const field = btn.closest('.field'); field.classList.add('pkfield');
  const pop = document.createElement('div'); pop.className = 'pickpop'; pop.innerHTML = `<div class="pkhost"></div><div class="pkfoot"><span class="hint">${o.multi ? 'Tick every deck it should appear in.' : 'Pick a deck or a bubble.'}</span><button type="button" class="btn sm primary" data-pk-done>Done</button></div>`;
  field.appendChild(pop); btn.setAttribute('aria-expanded', 'true');
  const pk = pkMount(pop.querySelector('.pkhost'), o);
  pop.querySelector('[data-pk-done]').addEventListener('click', closePicker);
  pk.focus();
}

/* ---------- browse ---------- */
function renderBrowse(){
  const q = browse.q.trim().toLowerCase();
  let cs = sortCards(cardsIn(browse.node));
  if (q) cs = cs.filter(c => [c.label, c.qText, c.mistake, c.solText, pathName(c.nodeId)].join(' ').toLowerCase().includes(q));
  const scope = cs;
  if (browse.status === 'done') cs = cs.filter(isDone); else if (browse.status === 'todo') cs = cs.filter(c => !isDone(c));
  if (browse.rate) cs = cs.filter(c => lastRate(c) === browse.rate);
  browse.ids = cs.map(c => c.id);
  const fcount = (st, r) => scope.filter(c => (st === 'done' ? isDone(c) : st === 'todo' ? !isDone(c) : true) && (!r || lastRate(c) === r)).length;
  const fchip = (label, st, r, cls='') => `<button class="fchip ${cls}" data-act="bfilter" data-st="${st}" data-r="${r}" aria-pressed="${browse.status === st && browse.rate === r}">${label}<span>${fcount(st, r)}</span></button>`;
  const filters = `<div class="filters">${fchip('All', 'all', 0)}${fchip('Not done', 'todo', 0)}${fchip('Done', 'done', 0)}<span class="fsep"></span>${[1,2,3,4].map(r => fchip('Last: ' + RATES[r][0], 'all', r, 'r' + r)).join('')}</div>`;
  const now = Date.now();
  const flat = flatTree();
  if (browse.node && browse.opened !== browse.node){ pathOf(browse.node).slice(0, -1).forEach(n => bexp.add(n.id)); browse.opened = browse.node; }
  const tree = (pid, d) => kids(pid).map(n => { const ch = kids(n.id).length, open = bexp.has(n.id);
    return `<div class="srow" style="padding-left:${d*14}px"><button class="caret ${ch ? '' : 'blank'}" data-act="bexp" data-id="${n.id}" aria-expanded="${open}" aria-label="${open ? 'Collapse' : 'Expand'} ${esc(n.name)}">${I.caret}</button><button class="sideitem" data-act="bnode" data-id="${n.id}" data-drop="${n.id}" draggable="true" aria-current="${browse.node===n.id}">${d === 0 ? `<span class="sdot" style="background:${scol(n.id)}"></span>` : ''}${esc(n.name)}<span class="c">${cardsIn(n.id).length}</span></button></div>` + (ch && open ? tree(n.id, d + 1) : ''); }).join('');
  const side = `<div class="sidehead"><span>Decks</span><button class="link" data-act="${bexp.size ? 'bcollapse' : 'bexpand'}">${bexp.size ? 'Collapse all' : 'Expand all'}</button></div><div class="srow"><span class="caret blank"></span><button class="sideitem" data-act="bnode" data-id="" aria-current="${!browse.node}">All cards<span class="c">${Object.keys(S.cards).length}</span></button></div>` + tree(null, 0);
  const rows = cs.slice(0, 400).map(c => {
    const added = c.createdAt ? new Date(c.createdAt).toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }) : '—';
    return `<tr data-act="edit" data-id="${c.id}" data-card="${c.id}" draggable="true" title="Drag onto a deck in the sidebar to move it (hold ⌥ Option to also keep it here)"><td><div class="q">${c.qImg ? `<button class="bthumb" data-gallery="${c.id}" data-i="0" aria-label="View question image" title="View images"><img src="${esc(imgSrc(c.qImg))}" alt="" loading="lazy"></button>` : ''}<div style="min-width:0"><div class="qt">${c.kind === 'learn' ? '<span class="ktag">Knowledge</span>' : ''}${c.label ? `<b>${esc(c.label)}</b> ` : ''}${esc(plainMd(c.qText) || (c.qImg ? '' : 'No question'))}</div>${c.mistake && c.kind !== 'learn' ? `<div class="sub qt" style="color:var(--mistake)">${esc(plainMd(c.mistake))}</div>` : ''}${(c.solImgs||[]).length ? `<button class="solink" data-gallery="${c.id}" data-i="${c.qImg ? 1 : 0}">View ${c.solImgs.length} ${c.kind === 'learn' ? 'explanation' : 'solution'} image${c.solImgs.length===1?'':'s'}</button>` : ''}</div></div></td>
      <td class="hide-sm sub">${esc(pathOf(c.nodeId).slice(1).map(n=>n.name).join(' :: ') || pathName(c.nodeId))}${linkedHere(c, browse.node) ? ` <span class="ltag" title="Linked here; the deck shown is its home">linked</span> <button class="link sm" data-act="unlink-here" data-id="${c.id}" data-ref="${esc(browse.node)}">remove from here</button>` : (c.also || []).length ? ` <span class="ltag" title="Also in: ${esc((c.also || []).map(refName).join(', '))}">+${c.also.length} more</span>` : ''}</td><td class="sub nowrap">${added}</td><td class="nowrap">${isDone(c) ? `${rateTag(c)}<span class="sub"> ${c.srs.reps}×</span>` : '<span class="sub">Not done</span>'}</td>
      <td><button class="icon" aria-label="Preview card" title="Preview" data-act="preview" data-id="${c.id}">▶</button></td></tr>`;
  }).join('');
  $('#root').innerHTML = `<div class="wide browser">

    </section></div>`;
}

/* ---------- stats ---------- */
function calibrationHtml(){
  const revs = Object.values(S.cards).flatMap(c => (c.revs || []).filter(r => r.cf != null));
  if (!revs.length) return `<div class="panel"><h2>Confidence vs. reality</h2><p class="sub" style="margin:0">Set your confidence before revealing answers (Harness layout) and this shows whether your gut feeling matches how well you really know things.</p></div>`;
  const B = [[0, 20], [20, 40], [40, 60], [60, 80], [80, 101]].map(([a, b]) => { const rs = revs.filter(r => r.cf >= a && r.cf < b); return { l: b > 100 ? '80–100%' : `${a}–${b}%`, n: rs.length, ok: rs.length ? Math.round(rs.filter(r => r.r >= 3).length / rs.length * 100) : null, mid: Math.min(90, a + 10) }; });
  const hi = B[4], over = hi.n >= 3 && hi.ok < 70;
  return `<div class="panel"><h2>Confidence vs. reality</h2><p class="sub" style="margin:-6px 0 12px">For each confidence level you chose, how often you then rated the card Good or Easy. Close to the dotted line means your confidence is well calibrated. ${hi.n >= 3 ? (over ? `<b>When you feel 80%+ sure you only know it ${hi.ok}% of the time</b>, so slow down on those.` : `When you feel 80%+ sure you're right ${hi.ok}% of the time.`) : ''}</p>
    <div class="calib">${B.map(b => `<div class="cb" title="${b.n} review${b.n === 1 ? '' : 's'}"><div class="cbar"><i class="target" style="bottom:${b.mid}%"></i>${b.ok != null ? `<span style="height:${b.ok}%"></span><b>${b.ok}%</b>` : ''}</div><small>${b.l}</small><em>${b.n}×</em></div>`).join('')}</div></div>`;
}

  else if (colRow.decks) Object.values(JSON.parse(colRow.decks)).forEach(d => decks[d.id] = String(d.name).split('::'));
  // note types
  const models = {};
  const nts = q('SELECT id, name, config FROM notetypes');
  if (nts && nts.length){
    nts.forEach(n => { let kind = 0; try { for (const [f, v] of pbRead(n.config)) if (f === 1) kind = v; } catch {} models[n.id] = { name: n.name, cloze: kind === 1, flds: [], tmpls: [] }; });
    (q('SELECT ntid, ord, name FROM fields ORDER BY ntid, ord') || []).forEach(f => models[f.ntid]?.flds.push(f.name));
    (q('SELECT ntid, ord, name, config FROM templates ORDER BY ntid, ord') || []).forEach(t => { let qf = '', af = ''; try { for (const [f, v] of pbRead(t.config)){ if (f === 1) qf = pbStr(v); if (f === 2) af = pbStr(v); } } catch {} models[t.ntid]?.tmpls.push({ ord: t.ord, q: qf, a: af }); });
  } else if (colRow.models){
    Object.values(JSON.parse(colRow.models)).forEach(m => models[m.id] = { name: m.name, cloze: m.type === 1, flds: [...m.flds].sort((a, b) => a.ord - b.ord).map(f => f.name), tmpls: m.tmpls.map(t => ({ ord: t.ord, q: t.qfmt, a: t.afmt })) });

  const rows = q('SELECT c.id AS cid, c.did, c.ord, c.type, c.queue, c.due, c.ivl, c.factor, c.reps, c.lapses, n.id AS nid, n.mid, n.flds, n.tags FROM cards c JOIN notes n ON c.nid = n.id ORDER BY c.did, n.id, c.ord') || [];
  db.close();

    const vals = String(r.flds).split('\x1f'), fields = {}; m.flds.forEach((f, i) => fields[f] = vals[i] ?? '');
    const tp = m.cloze ? m.tmpls[0] : (m.tmpls.find(t => t.ord === r.ord) || m.tmpls[0]); if (!tp) continue;
    let qh = ankiRender(tp.q, fields, r.ord, 'q'), ah = ankiRender(tp.a, fields, r.ord, 'a');
    ah = ah.replace(/^[\s\S]*?<hr[^>]*id\s*=\s*["']?answer["']?[^>]*>/i, '');
    const Q = ankiHtml(qh), A = ankiHtml(ah);

      const due = r.type === 2 ? (crt + r.due * 86400) * 1000 : (r.queue === 1 ? r.due * 1000 : now);
      srs = { ...freshSrs(), state: r.type === 2 ? 'review' : r.type === 3 ? 'relearning' : 'learning', ivl: Math.max(0, r.ivl > 0 ? r.ivl : 0), ease: r.factor ? r.factor / 1000 : 2.5, reps: r.reps || 0, lapses: r.lapses || 0, due: isFinite(due) ? due : now };

    cards.push({ path: decks[r.did] || ['Imported'], qText: Q.text, solText: A.text, qImgs, aImgs, srs, suspended: r.queue === -1, tags: String(r.tags || '').trim() });
  }
  return { kind: 'anki', name: fileName.replace(/\.(apkg|colpkg)$/i, ''), cards, media, hasProgress: cards.some(c => c.srs) };
}

function readText(text, fileName){
  const lines = text.replace(/^﻿/, '').split(/\r?\n/);
  let sep = null; const hdr = lines.find(l => /^#separator:/i.test(l));
  if (hdr){ const v = hdr.split(':')[1].trim().toLowerCase(); sep = { tab: '\t', comma: ',', semicolon: ';', pipe: '|', space: ' ' }[v] || v; }
  const body = lines.filter(l => l.trim() && !l.startsWith('#'));
  if (!sep) sep = body.some(l => l.includes('\t')) ? '\t' : body.some(l => l.includes(';')) && !body.some(l => l.includes(',')) ? ';' : ',';
  const split = l => {
    if (sep !== ',' && sep !== ';') return l.split(sep).map(f => /^".*"$/s.test(f.trim()) ? f.trim().slice(1, -1).replace(/""/g, '"') : f);
    const out = []; let cur = '', qd = false;
    for (let i = 0; i < l.length; i++){ const ch = l[i]; if (qd){ if (ch === '"' && l[i + 1] === '"'){ cur += '"'; i++; } else if (ch === '"') qd = false; else cur += ch; } else if (ch === '"') qd = true; else if (ch === sep){ out.push(cur); cur = ''; } else cur += ch; }
    out.push(cur); return out;
  };
  const cards = body.map(split).filter(f => f[0]?.trim()).map(f => ({ path: [], qText: ankiHtml(f[0]).text, solText: ankiHtml(f.slice(1).join('\n')).text, qImgs: [], aImgs: [] }));
  return { kind: 'text', name: fileName.replace(/\.(txt|csv|tsv)$/i, ''), cards, media: new Map(), hasProgress: false };
}

async function readRecall(bytes, fileName){
  const { unzipSync, strFromU8 } = await loadLib('fflate');
  const z = unzipSync(bytes); if (!z['deck.json']) throw new Error("This isn't a Recall deck file.");
  const d = JSON.parse(strFromU8(z['deck.json'])); if (d.format !== 'recall-deck') throw new Error("This isn't a Recall deck file.");
  const byId = Object.fromEntries(d.nodes.map(n => [n.id, n]));
  const pathOfN = id => { const p = []; let n = byId[id]; while (n){ p.unshift(n.name); n = byId[n.parent]; } return p; };
  const media = new Map(); Object.keys(z).filter(k => k.startsWith('images/')).forEach(k => media.set(k, z[k]));
  const meta = {}; d.nodes.forEach(n => meta[pathOfN(n.id).join('\x1f')] = n);
  const cards = d.cards.map(c => ({ path: pathOfN(c.node), qText: c.qText || '', solText: c.solText || '', mistake: c.mistake || '', label: c.label || '', kind: c.kind, qtype: c.qtype, source: c.source, qImgs: c.qImg ? [c.qImg] : [], aImgs: c.solImgs || [], srs: c.srs || null }));
  return { kind: 'recall', name: d.name || fileName.replace(/\.recall$/i, ''), cards, media, meta, hasProgress: cards.some(c => c.srs), whole: !!d.whole };
}

async function readImport(file){
  const name = file.name || 'Imported', ext = extOf(name);
  const bytes = new Uint8Array(await file.arrayBuffer());
  if (ext === 'apkg' || ext === 'colpkg') return readAnki(bytes, name);
  if (ext === 'recall') return readRecall(bytes, name);
  if (['txt', 'csv', 'tsv'].includes(ext)) return readText(new TextDecoder().decode(bytes), name);
  throw new Error('Recall can import .apkg, .colpkg, .recall, .txt, .csv and .tsv files.');
}

function importTree(d){

  const total = k => [...counts].filter(([p]) => p === k || p.startsWith(k + '\x1f')).reduce((a, [, n]) => a + n, 0);

}

async function storeBytes(bytes, name){

async function runImport(){
  const d = importData; if (!d) return;

  const keep = !!$('#improg')?.checked;
  let destRef = null;
  if (into){ destRef = [...importSel][0]; if (!destRef) return toast('Pick a deck to import into.'); }
  const btn = $('#imgo'); btn.disabled = true;
  undoTx = null; undoLabel = 'import';
  const now = Date.now();
  // where it goes: a deck you picked, the top level (a whole-library .recall), or a new subject
  const tops = [...new Set(d.cards.map(c => c.path[0]))];
  let rootId = null, rootK = null, strip = 0;
  if (into){ [rootId, rootK] = String(destRef).split('::'); }

    const n = { id: uid('n'), name, parentId: null, order: kids(null).length ? Math.max(...kids(null).map(k => k.order ?? 0)) + 1 : 0, createdAt: now };
    const rm = tops.length === 1 ? d.meta?.[tops[0]] : null; if (rm?.emoji) n.emoji = rm.emoji; if (rm?.color) n.color = rm.color; if (rm?.types) n.types = rm.types;
    await put('nodes', n); rootId = n.id;
    strip = tops.length === 1 && tops[0] ? 1 : 0;
  }

  const ensure = async (full) => {
    let parent = rootId;
    for (let i = strip; i < full.length; i++){
      const key = full.slice(0, i + 1).join('\x1f');
      if (nodeFor.has(key)){ parent = nodeFor.get(key); continue; }
      const name = String(full[i]).replace(/::/g, ' ').trim() || 'Untitled';
      let ex = kids(parent).find(k => k.name.toLowerCase() === name.toLowerCase());
      if (!ex){
        const m = d.meta?.[key];
        ex = { id: uid('n'), name, parentId: parent, order: kids(parent).length ? Math.max(...kids(parent).map(k => k.order ?? 0)) + 1 : 0, createdAt: now };
        if (m?.emoji) ex.emoji = m.emoji; if (m?.color) ex.color = m.color; if (m?.types) ex.types = m.types;
        await put('nodes', ex);

    const ai = []; for (const n of c.aImgs) { const r = await img(n); if (r) ai.push(r); }
    const card = { id: uid('c'), nodeId, label: c.label || '', qText: c.qText || '', qImg: qi[0] || null, mistake: c.mistake || '', solText: c.solText || '', solImgs: [...qi.slice(1), ...ai], createdAt: now, order: now + done, srs: keep && c.srs ? { ...freshSrs(), ...c.srs } : freshSrs(), source: c.source || (d.kind === 'anki' ? 'Anki' : d.kind === 'text' ? 'Imported text' : '') };
    card.kind = d.kind === 'recall' ? (c.kind || undefined) : 'learn'; if (!card.kind) delete card.kind;
    if (!card.source) delete card.source;
    const hostK = c.path.length > strip ? null : rootK;
    const qk = c.qtype && typesOf(nodeId).some(t => t.k === c.qtype) ? c.qtype : (hostK && nodeId === rootId ? hostK : null);
    if (qk) card.qtype = qk;

  }

  view = rootId ? { name: 'overview', node: into ? destRef : rootId } : { name: 'decks', node: null }; render();

async function imgBytes(im){
  if (!im) return null;
  try { if (im.data){ const b = atob(im.data.split(',')[1]); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return { bytes: u, ext: (im.data.match(/^data:image\/(\w+)/) || [])[1] || 'jpg' }; }
    const src = imgSrc(im); const r = await fetch(src); if (!r.ok) return null; const b = new Uint8Array(await r.arrayBuffer());
    const ext = extOf(im.file || '') || ({ 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/gif': 'gif' }[r.headers.get('content-type')] || 'png');
    return { bytes: b, ext };
  } catch { return null; }
}
async function buildRecall(id, withProgress){
  const { zipSync, strToU8 } = await loadLib('fflate');
  const files = {}; let imgN = 0;
  const rootIds = id ? [String(id).split('::')[0]] : kids(null).map(n => n.id);
  const virt = id && String(id).includes('::') ? nodeOf(id) : null;
  const nodes = [], local = new Map();
  const addNode = (n, parent) => { const lid = 'n' + (nodes.length + 1); local.set(n.id, lid); const o = { id: lid, name: n.name, parent }; if (n.emoji) o.emoji = n.emoji; if (n.color) o.color = n.color; if (n.types?.length) o.types = n.types; nodes.push(o); kids(n.id).forEach(k => addNode(k, lid)); };
  let rootLocal = null;
  if (!id){ rootLocal = 'n0'; nodes.push({ id: 'n0', name: 'Recall decks', parent: null }); rootIds.forEach(r => addNode(S.nodes[r], 'n0')); }
  else if (virt){ rootLocal = 'n1'; nodes.push({ id: 'n1', name: virt.name, parent: null }); local.set(virt.id, 'n1'); }
  else { addNode(S.nodes[rootIds[0]], null); rootLocal = local.get(rootIds[0]); }
  const cs = id ? cardsIn(id) : Object.values(S.cards);
  const cards = [];
  const putImg = async im => { const b = await imgBytes(im); if (!b) return null; const k = `images/${++imgN}.${b.ext}`; files[k] = b.bytes; return k; };
  for (const c of cs){
    const node = virt ? 'n1' : (local.get(c.nodeId) || rootLocal);
    const o = { node, qText: c.qText || '', solText: c.solText || '' };
    if (c.mistake) o.mistake = c.mistake; if (c.label) o.label = c.label; if (c.kind) o.kind = c.kind; if (c.qtype && !virt && local.has(c.nodeId)) o.qtype = c.qtype; if (c.source) o.source = c.source;
    if (c.qImg){ const k = await putImg(c.qImg); if (k) o.qImg = k; }
    const sol = []; for (const im of c.solImgs || []){ const k = await putImg(im); if (k) sol.push(k); } if (sol.length) o.solImgs = sol;
    if (withProgress && c.srs) o.srs = c.srs;
    cards.push(o);
  }

  files['deck.json'] = strToU8(JSON.stringify({ format: 'recall-deck', version: 1, app: 'Recall', name, whole: !id, exported: new Date().toISOString(), nodes, cards }));
  return zipSync(files, { level: 6 });
}
function buildTxt(id){
  const cs = id ? cardsIn(id) : Object.values(S.cards);
  const clean = s => rich(String(s || '').replace(/\t/g, ' ')).replace(/\n/g, ' ');
  const lines = ['#separator:tab', '#html:true', '#columns:Front\tBack\tDeck'];
  cs.forEach(c => { const back = [c.mistake ? 'My mistake: ' + c.mistake : '', c.solText].filter(Boolean).join('\n\n'); lines.push([clean((c.label ? c.label + ' ' : '') + c.qText), clean(back), pathName(c.nodeId).replace(/ › /g, '::')].join('\t')); });
  return new TextEncoder().encode(lines.join('\n'));
}

function findPath(parts){ let pid = null, n = null; for (const p of parts){ n = kids(pid).find(k => k.name.toLowerCase() === p.toLowerCase()); if (!n) return null; pid = n.id; } return n; }
function defaultTypesFor(path){
  const parts = path.split('::').map(x => x.trim()).filter(Boolean); if (parts.length < 2 && !/::\s*$/.test(path)) return [];
  const parentParts = /::\s*$/.test(path) ? parts : parts.slice(0, -1);
  const parent = findPath(parentParts); if (!parent || parent.parentId) return [];
  const used = new Set(); kids(parent.id).forEach(t => typesOf(t.id).forEach(x => used.add(x.k)));
  return Object.keys(QTYPES).filter(k => used.has(k));
}
async function ensurePath(path){
  const parts = path.split('::').map(s => s.trim()).filter(Boolean); let pid = null, made = 0;
  for (const p of parts){
    let n = kids(pid).find(k => k.name.toLowerCase() === p.toLowerCase());
    if (!n){ n = { id: uid('n'), name: p, parentId: pid, order: kids(pid).length ? Math.max(...kids(pid).map(k => k.order ?? 0)) + 1 : 0, createdAt: Date.now() }; await put('nodes', n); made++; }
    pid = n.id;
  }
  return { id: pid, made };
}

async function relinkFrom(sub, to){
  for (const c of Object.values(S.cards)){
    const also = c.also || []; if (!also.some(r => sub.has(String(r).split('::')[0]))) continue;
    let next = also.map(r => sub.has(String(r).split('::')[0]) ? to : r).filter(Boolean);
    next = [...new Set(next)].filter(r => r !== c.nodeId && r !== homeRef(c));
    const nc = { ...c }; if (next.length) nc.also = next; else delete nc.also; await put('cards', nc);
  }
}

  const sub = subtree(id), cs = primaryIn(id);
  for (const c of cs) await put('cards', { ...c, nodeId: n.parentId });
  await relinkFrom(sub, n.parentId);
  for (const nid of sub) await del('nodes', nid);
  return cs.length;
}

    case 'do-link': { if (!linkSel.size) return toast('Tick at least one deck.'); let n = 0; for (const r of linkSel) n += await linkCards(linkIds, r); const names = [...linkSel].map(refName); closeDialog(); return toast(n ? `Added to ${names.length === 1 ? names[0] : names.length + ' decks'}` : 'They were already there'); }
    case 'unlink-here': { e.stopPropagation(); const c = S.cards[id], ref = a.dataset.ref; if (!c) return; const [b, k] = ref.split('::'), set = subtree(b); const also = (c.also || []).filter(r => !refIn(r, set, k)); const nc = { ...c }; if (also.length) nc.also = also; else delete nc.also; await put('cards', nc); render(); return toast('Removed from this deck (the card itself is kept)'); }
    case 'do-move': { const v = [...moveSel][0]; if (!v) return toast('Choose where to move it.'); const host = v === '__top' ? null : v; const n = nodeOf(id); if ((n.parentId || null) === host) return closeDialog(); $('#layer').innerHTML = ''; return doMove(id, host, null); }
    case 'save-bubble': { const v = cleanName($('#bname').value); if (!v){ toast('Type a name for the bubble.'); return $('#bname').focus(); }
      if (!await addType(id, v)) return $('#bname').focus();
      $('#layer').innerHTML = ''; const n = S.nodes[id];
      if (n.parentId && S.nodes[n.parentId]?.parentId && !(view.name === 'overview' && view.node === id)) view = { name:'overview', node: id };
      collapsed.delete(id); collapsed.delete(n.parentId); render(); return toast(`Added “${v}” to ${n.name}`); }
    case 'mtype-quick': await saveManageNames(id); await addType(id, QTYPES[a.dataset.k]); return manageDialog(id);
    case 'mtype-add': { const v = cleanName($('#mtnew').value); if (!v){ toast('Type a name for the bubble.'); return $('#mtnew').focus(); } await saveManageNames(id); const ok = await addType(id, v); manageDialog(id); if (!ok) $('#mtnew').value = v; else toast(`Added “${v}”`); return $('#mtnew').focus(); }
    case 'mtype-del': { if (a.dataset.confirm !== '1'){ a.dataset.confirm = '1'; a.textContent = 'Confirm'; return; } await saveManageNames(id); await removeType(id, a.dataset.k); manageDialog(id); return toast('Bubble removed, its cards stay in the topic'); }
    case 'del-type': { const tn = nodeOf(id), cc = cardsIn(id).length; return openDialog(`<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="xt" style="max-width:440px"><header><h2 id="xt">Remove “${esc(tn.name)}”?</h2></header>
      <div class="body"><p style="margin:0;color:var(--fg-2)">The bubble disappears from ${esc(S.nodes[tn.parentId].name)}. ${cc ? `Its ${cc} card${cc===1?'':'s'} stay in the topic, and come back here if you add a bubble with the same name again.` : 'It has no cards.'}</p></div>
      <footer><span class="grow"></span><button class="btn" data-act="close">Cancel</button><button class="btn danger" data-act="do-del-type" data-id="${id}">Remove</button></footer></div>`, d => d.querySelector('[data-act="close"]').focus()); }
    case 'do-del-type': { const tn = nodeOf(id); $('#layer').innerHTML = ''; await removeType(tn.parentId, tn.qtype); if (view.node === id) view = { name:'overview', node: tn.parentId }; if (browse.node === id) browse.node = tn.parentId; render(); return toast('Bubble removed'); }
    case 'collapse-all': undoRecordUi(); kids(null).forEach(n => { collapsed.add(n.id); kids(n.id).forEach(t => collapsed.add(t.id)); }); ls.set('md-collapsed', [...collapsed]); return render();
    case 'expand-all': undoRecordUi(); kids(null).forEach(n => { collapsed.delete(n.id); kids(n.id).forEach(t => collapsed.delete(t.id)); }); ls.set('md-collapsed', [...collapsed]); return render();
    case 'save-custom': { const v = $('#cname').value.replace(/::/g, ' ').trim(); if (!v) return toast('Type a name.'); const dlg = $('#layer .dialog'); const em = $('#cicon').value.trim(), col = dlg.dataset.color || ''; const tn = nodeOf(id);
      if (tn?.virtual){ const host = S.nodes[tn.parentId]; const types = typesOf(host.id).map(t => { if (t.k !== tn.qtype) return t; const u = { ...t, name: v, emoji: em, color: col }; if (!em) delete u.emoji; if (!col) delete u.color; return u; }); await put('nodes', { ...host, types }); closeDialog(); return toast('Saved'); }
      const nn = { ...S.nodes[id], name: v, emoji: em, color: col }; if (!nn.emoji) delete nn.emoji; if (!nn.color) delete nn.color; await put('nodes', nn); closeDialog(); return toast('Saved'); }
    case 'del-deck': return confirmDelete(id);
    case 'do-del-deck': { $('#layer').innerHTML = ''; await deleteDeck(id); if (view.node && !nodeOf(view.node)) view = { name:'decks', node:null }; render(); return toast('Deleted'); }
    case 'do-del-keep': { $('#layer').innerHTML = ''; const parent = S.nodes[id]?.parentId; const moved = await deleteKeepCards(id); if (view.node && !nodeOf(view.node)) view = { name:'overview', node: parent }; if (browse.node && !nodeOf(browse.node)) browse.node = parent; render(); return toast(`Deleted, ${moved} card${moved===1?'':'s'} moved to ${S.nodes[parent]?.name || 'the topic'}`); }
    case 'options': return optionsDialog();
    case 'save-options': { const v = parseInt($('#npd').value, 10); S.settings.newPerDay = isNaN(v) ? 20 : Math.max(0, Math.min(999, v)); await saveSettings(); closeDialog(); return toast('Saved'); }
    case 'add-here': return editor(null, id);
    case 'browse-here': browse.node = id; browse.q = ''; browse.status = 'all'; browse.rate = 0; return go('browse');
    case 'bnode': browse.node = id; return renderBrowse();
    case 'bfilter': browse.status = a.dataset.st; browse.rate = +a.dataset.r || 0; return renderBrowse();
    case 'browse-status': e.stopPropagation(); browse = { ...browse, node: id || null, q:'', status: a.dataset.st, rate: 0 }; return go('browse');
    case 'browse-rate': browse = { ...browse, node: id || null, q:'', status: 'all', rate: +a.dataset.r }; return go('browse');
    case 'practise-list': return startStudy(browse.node, true, null, browse.ids || []);
    case 'reset-deck': return resetDialog(id);
    case 'reset-all': return fullResetStep1();
    case 'reset-all-2': return fullResetStep2();
    case 'do-reset-all': { if ($('#frtext')?.value.trim() !== 'RESET') return; $('#layer').innerHTML = ''; const n = await resetCards(null, true); render(); return toast(`Full reset done: ${n} cards back to not done`); }
    case 'do-reset': { const clear = !!$('#rslog')?.checked; $('#layer').innerHTML = ''; const n = await resetCards(id, clear); render(); return toast(`Reset ${n} card${n===1?'':'s'}`); }
    case 'bexp': undoRecordUi(); bexp.has(id) ? bexp.delete(id) : bexp.add(id); ls.set('md-bexp', [...bexp]); return renderBrowse();
    case 'bcollapse': undoRecordUi(); bexp.clear(); ls.set('md-bexp', []); return renderBrowse();
    case 'bexpand': undoRecordUi(); Object.values(S.nodes).forEach(n => { if (kids(n.id).length) bexp.add(n.id); }); ls.set('md-bexp', [...bexp]); return renderBrowse();
    case 'study': return startStudy(id);
    case 'back-card': return goBack();
    case 'shuffle-toggle': undoRecordUi(); shuffleOn = !shuffleOn; ls.set('md-shuffle', shuffleOn); render(); return toast(shuffleOn ? 'Shuffle on: cards come in a random order' : 'Shuffle off: cards come in order');
    case 'reshuffle': { if (!study) return; study.queue = shuffled(study.queue); renderStudy(); typeset($('#root')); return toast('Shuffled the ' + study.queue.length + ' cards left'); }
    case 'practise': return startStudy(id || null, true);
    case 'preview': e.stopPropagation(); return startStudy(S.cards[id]?.nodeId || null, true, id);
    case 'show': return showAnswer();
    case 'rate': return rate(+a.dataset.r);
    case 'edit': return editor(id || study?.cur);
    case 'clean-img': { e.stopPropagation(); if (!ed) return; const z = a.dataset.zone, i = +a.dataset.i, e0 = ed; const im = z === 'q' ? e0.card.qImg : (e0.card.solImgs || [])[i]; if (!im) return;
      const crop = a.dataset.mode === 'crop';
      return cleanerDialog(im, async f => { e0.pend[z]++; if (ed === e0) drawThumbs(); try { const n = await storeImage(f); if (z === 'q') e0.card.qImg = n; else { const arr = [...(e0.card.solImgs || [])]; arr[i] = n; e0.card.solImgs = arr; } toast(crop ? 'Image updated' : 'Cleaned image added'); } catch { toast('Could not save the image.'); } e0.pend[z]--; if (ed === e0) drawThumbs(); }, { enhance: !crop }); }
    case 'pick': e.stopPropagation(); zone(a.dataset.zone); return $('#efile').click();
    case 'rm-img': if (a.dataset.zone === 'q') ed.card.qImg = null; else ed.card.solImgs.splice(+a.dataset.i, 1); return drawThumbs();
    case 'reset-srs': ed.card.srs = freshSrs(); return toast('Progress resets to New when you save.');
    case 'del-card': { const c = ed.card; if (a.dataset.confirm !== '1'){ a.dataset.confirm = '1'; a.textContent = 'Click again to delete'; return; } $('#layer').innerHTML = ''; ed = null; await del('cards', c.id); if (view.name === 'study'){ if (study.cur === c.id){ nextCard(); } renderStudy(); } else render(); return toast('Card deleted · ⌘Z to undo'); }
    case 'save-card': return saveCard();
    case 'add-mistake': { const c = S.cards[study.cur]; $('#addm').innerHTML = `<textarea class="in" id="qm" placeholder="What went wrong, and what to remember next time"></textarea><div style="display:flex;gap:8px"><button class="btn sm primary" data-act="save-mistake">Save</button></div>`; autoGrow($('#qm')); $('#qm').focus(); return; }
    case 'save-mistake': { const v = $('#qm').value.trim(); if (!v) return; const c = S.cards[study.cur]; await put('cards', { ...c, mistake: v }); $('#addm').outerHTML = `<div class="stext rich">${rich(v)}</div>`; typeset($('.answer')); return toast('Saved'); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'bsearch'){ browse.q = e.target.value; clearTimeout(window.__bs); window.__bs = setTimeout(() => { const pos = e.target.selectionStart; renderBrowse(); const s = $('#bsearch'); s.focus(); s.setSelectionRange(pos, pos); }, 160); }
});
document.addEventListener('change', e => { if (e.target.id === 'bselect'){ browse.node = e.target.value || null; renderBrowse(); } });
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.items || [])].filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile());
  if (!files.length) return;
  if (cleanerOpen()){ e.preventDefault(); return clLoad(files[0]); }
  if (ed){ e.preventDefault(); return addFiles(files, ed.zone); }
  if (!dialogOpen() && S.ready && view.name !== 'study'){ e.preventDefault(); editor(null, view.node || browse.node, files[0]); }
});
function cardMenu(id, at){
  closeMenu(); const c = S.cards[id]; if (!c) return;
  const here = view.name === 'browse' ? browse.node : null, linked = linkedHere(c, here);
  const m = document.createElement('div'); m.id = 'menu'; m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = `<button data-act="edit" data-id="${id}">Edit card</button><button data-act="cm-practise" data-id="${id}">Practise this card</button><hr>
    <button data-act="cm-move" data-id="${id}">Move to…</button><button data-act="cm-also" data-id="${id}">Show in decks…</button>
    ${linked ? `<button data-act="cm-unlink" data-id="${id}">Remove from ${esc(nodeOf(here)?.name || 'this deck')}</button>` : ''}
    <button data-act="cm-reset" data-id="${id}">Reset progress</button><hr><button class="danger" data-act="cm-delete" data-id="${id}">Delete card…</button>`;
  document.body.appendChild(m);
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(innerWidth - w - 8, at.x)) + 'px'; m.style.top = Math.max(8, Math.min(innerHeight - h - 8, at.y)) + 'px';
  m.querySelector('button').focus();
}
function cardMoveDialog(id){
  const c = S.cards[id]; if (!c) return; const here = view.name === 'browse' ? browse.node : null;
  const from = here && linkedHere(c, here) ? here : homeRef(c);
  openDialog(`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cmv" style="max-width:480px"><header><h2 id="cmv">Move card</h2></header>
    <div class="body"><p class="hint" style="margin:0">It leaves <b>${esc(refName(from))}</b> and goes to the deck you pick. Any other decks it's ticked in stay as they are.</p><div class="pkinline" id="cmvtree"></div></div>
    <footer><span class="grow"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="do-cmove" data-id="${id}">Move</button></footer></div>`, () => {
      cardMoveSel = new Set([from]); cardMoveFrom = here;
      pkMount($('#cmvtree'), { multi: false, bubbles: true, sel: cardMoveSel }).focus();
    });
}
let cardMoveSel = new Set(), cardMoveFrom = null, cardAlsoSel = new Set();
function cardAlsoDialog(id){
  const c = S.cards[id]; if (!c) return;
  openDialog(`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cas" style="max-width:480px"><header><h2 id="cas">Show this card in…</h2></header>
    <div class="body"><p class="hint" style="margin:0">Its home is <b>${esc(refName(homeRef(c)))}</b>. Tick any other decks it should also appear in, and untick ones it shouldn't.</p><div class="pkinline" id="castree"></div></div>
    <footer><span class="grow"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="do-calso" data-id="${id}">Save</button></footer></div>`, () => {
      cardAlsoSel = new Set([homeRef(c), ...(c.also || [])]);
      pkMount($('#castree'), { multi: true, bubbles: true, sel: cardAlsoSel, disabled: r => r === homeRef(c) || r === c.nodeId }).focus();
    });
}
function confirmCardDelete(id){
  const c = S.cards[id]; if (!c) return;
  openDialog(`<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="xc" style="max-width:440px"><header><h2 id="xc">Delete this card?</h2></header>
    <div class="body"><p style="margin:0;color:var(--fg-2)">“${esc(c.label || (c.qText || 'Card').slice(0, 60))}” is removed from every deck it's in. You can undo with ⌘Z.</p></div>
    <footer><span class="grow"></span><button class="btn" data-act="close">Cancel</button><button class="btn danger" data-act="do-del-card" data-id="${id}">Delete</button></footer></div>`, d => d.querySelector('.btn.danger').focus());
}
document.addEventListener('contextmenu', e => {
  const row = e.target.closest('tr[data-card]');
  if (row && !$('#layer .dialog')){ e.preventDefault(); return cardMenu(row.dataset.card, { x: e.clientX, y: e.clientY }); }
  const t = e.target.closest('[data-act="open"][data-id], .sideitem[data-act="bnode"][data-id]');
  const id = t?.dataset.id; if (!id || !nodeOf(id) || $('#layer .dialog')) return;
  e.preventDefault(); gearMenu(id, { x: e.clientX, y: e.clientY });
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === 'z' && !isTyping(document.activeElement) && !cleanerOpen()){ e.preventDefault(); undoTx = null; return e.shiftKey ? appRedo() : appUndo(); }
  if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === 'y' && !isTyping(document.activeElement)){ e.preventDefault(); return appRedo(); }
  if (cleanerOpen()){ if (e.key === 'Escape'){ e.preventDefault(); closeCleaner(); } return; }
  if (e.key === 'Escape' && $('.pickpop')){ e.preventDefault(); return closePicker(); }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ($('.lightbox') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')){ e.preventDefault(); return stepGallery(e.key === 'ArrowRight' ? 1 : -1); }
  if (e.key === 'Escape'){ const lb = $('.lightbox'); if (lb){ gallery = null; return lb.remove(); } if ($('#menu')) return closeMenu(); if (dialogOpen()) return closeDialog(); if (view.name === 'study'){ const n = study?.node; study = null; return n ? go('overview', n) : go('decks'); } return; }
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 's' && document.body.classList.contains('desktop')){ e.preventDefault(); return toggleSidebar(); }
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && (e.key.toLowerCase() === 'k' || (e.key.toLowerCase() === 'f' && view.name !== 'browse')) && $('#sidesq') && getComputedStyle($('.sidesearch')).display !== 'none' && !dialogOpen()){ e.preventDefault(); if (document.body.classList.contains('sidebar-hidden')) toggleSidebar(); const q = $('#sidesq'); q.focus(); q.select(); return; }
  if (ed && (e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); return saveCard(); }
  if (dialogOpen() && e.key === 'Enter' && e.target.tagName === 'INPUT'){ const p = (e.target.dataset.enter && $(e.target.dataset.enter)) || $('#layer .btn.primary'); if (p && !ed){ e.preventDefault(); p.click(); } return; }
  if (view.name === 'study' && study?.cur && !study.shown && e.target.id === 'dthink' && (e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); return showAnswer(); }
  if (view.name === 'study' && study?.cur && e.target.id === 'dthink' && e.key === 'Escape'){ e.target.blur(); return; }
  if (dialogOpen() || typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (view.name === 'study' && study && (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace')){ e.preventDefault(); return goBack(); }
  if (view.name === 'study' && study?.cur){
    if (!study.shown && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); return showAnswer(); }
    if (study.shown && ['1','2','3','4'].includes(e.key)){ e.preventDefault(); return rate(+e.key); }
    if (study.shown && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); return rate(3); }
    if (e.key === 'e'){ e.preventDefault(); return editor(study.cur); }
  }
  if (view.name !== 'study'){
    if (e.key === 'a') { e.preventDefault(); return editor(null, view.node || browse.node); }
    if (e.key === 'd') return go('decks');
    if (e.key === 'b') return go('browse');
    if (e.key === 's' && view.name === 'overview') return startStudy(view.node);
  }
});
function lhMigrate(){
  if (ls.get('lh-look-1', false)) return; ls.set('lh-look-1', true);
  const ts = { ...themeSettings(), base: 'harness', over: {}, layout: 'harness' }; Object.values(FONT_KEY).forEach(k => delete ts[k]);
  undoMute = true; saveTheme(ts); undoMute = false; render();
}
initStore().finally(() => { lhMigrate(); cloudBoot(); });
render();
</script>
