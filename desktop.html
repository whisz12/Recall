<style>
/* Layout: brand + pill nav; deck screen = quiet summary tiles, then one card per subject holding its topic/subtopic tree; study = question on a card surface, answer slides in below a divider, tinted answer buttons in a bottom bar. Calm slate dark, colour only where it carries meaning. */
:root{
  color-scheme: dark;
  --bg:#14161b; --surface:#1c1f26; --surface-2:#232731; --hover:#2a2f3a; --inset:#171a20;
  --border:#2a2f39; --border-2:#363c48;
  --fg:#e7e9ef; --fg-2:#aab0bf; --fg-3:#767d8d; --zero:#454b57;
  --accent:#9aa6ff; --accent-btn:#6b6bf5;
  --new:#62a8ff; --learn:#ff7a85; --review:#3ddc84;
  --again:#ff6f7d; --hard:#ffa257; --good:#4fdc8f; --easy:#62b4ff;
  --mistake:#ff7d8c; --solution:#6ff0a8;
  --ovr:255,255,255; --fg-hi:#fff; --btn-fg:#fff; --bar:rgba(20,22,27,.86); --side:rgba(18,20,25,.55); --glow:rgba(142,156,240,.09);
  --qa-bg:#1c1f26; --qa-fg:#e7e9ef;
  --mk-bg:#3a2754; --mk-b:#6d4a8c; --mk-fg:#fff; --so-bg:#12514f; --so-b:#23877c; --so-fg:#f2fbf7; --ex-bg:#17375a; --ex-b:#2d6aa6; --ex-t:#8ecbff; --ex-fg:#eef6ff;
  --focus:#8e9cf0;
  --ui:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --card:"Source Serif 4", Charter, "Iowan Old Style", Georgia, serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --side-font:"Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(1000px 420px at 50% -160px, var(--glow), transparent 70%);background-repeat:no-repeat;color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}

/* toolbar */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.toolbar .tin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:13px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.015em;line-height:1;border:0;background:none;padding:2px 0;color:var(--fg)}
.brand .logo{width:28px;height:28px;flex:none;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(var(--ovr),.06)}
.brand:hover span{color:var(--fg-hi)}
.brand i{width:24px;height:24px;border-radius:6px;background:linear-gradient(150deg,#7d8be6,#5b67c9);display:grid;place-items:center;font-style:normal;font-family:var(--card);font-size:14px;color:#fff}
.toolbar nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.toolbar nav button{border:0;background:transparent;color:var(--fg-2);padding:6px 13px;border-radius:999px;font-size:13px;font-weight:500}
.toolbar nav button:hover{color:var(--fg);background:var(--hover)}
.toolbar nav button[aria-current="true"]{color:var(--fg);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-2)}

.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 90px}
.narrow{max-width:780px;margin:0 auto}
.wide{max-width:1100px;margin:0 auto}

/* buttons */
.btn{background:var(--surface-2);border:1px solid var(--border-2);border-radius:6px;padding:7px 14px;color:var(--fg);font-size:13px;font-weight:500;line-height:1.3;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent-btn);border-color:transparent;color:var(--btn-fg)}
.btn.primary:hover{background:color-mix(in srgb, var(--accent-btn) 86%, #fff)}
.btn.big{padding:10px 22px;font-size:14px;border-radius:10px}
.btn.danger{color:color-mix(in srgb, var(--again) 70%, var(--fg));border-color:color-mix(in srgb, var(--again) 35%, var(--surface))}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:6px}
.link{border:0;background:none;color:var(--fg-2);padding:3px 6px;border-radius:6px;font-size:13px}
.link:hover{color:var(--fg);background:var(--hover)}
.icon{width:30px;height:30px;border:0;background:transparent;border-radius:6px;color:var(--fg-3);display:inline-grid;place-items:center}
.icon:hover{background:var(--hover);color:var(--fg)}
.icon svg{width:16px;height:16px}

/* deck screen */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hello h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.hello p{margin:0;color:var(--fg-2);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.tile span{font-size:12px;color:var(--fg-3)}
.colhead,.drow{display:grid;grid-template-columns:minmax(0,1fr) 46px 46px 46px 34px;align-items:center;gap:2px}
.colhead{padding:0 12px 6px;font-size:11px;font-weight:600;color:var(--fg-3);}
.colhead span:not(:first-child),.drow .num{text-align:right;padding-right:6px}
.subject{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.subject .shead{padding:12px 12px 10px;border-bottom:1px solid var(--border)}
.subject .shead .dlink{font-size:15px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none;margin:0 6px 0 4px;box-shadow:0 0 0 3px color-mix(in srgb, var(--sc) 18%, transparent)}
.prog{height:3px;background:var(--inset);border-radius:4px;overflow:hidden;margin:9px 34px 0 31px;display:flex}
.prog span{height:100%}
.drow{padding:5px 12px;border-radius:0}
.subject .rows{padding:4px 0 6px}
.subject .rows .drow:hover{background:var(--surface-2)}
.dname{display:flex;align-items:center;gap:2px;min-width:0}
.caret{width:22px;height:22px;border:0;background:none;color:var(--fg-3);flex:none;padding:0;display:grid;place-items:center;border-radius:6px}
.caret:hover{color:var(--fg);background:var(--hover)}
.caret svg{width:10px;height:10px;transition:transform .15s}
.caret[aria-expanded="true"] svg{transform:rotate(90deg)}
.caret.blank{visibility:hidden}
.dlink{border:0;background:none;color:var(--fg);padding:2px 4px;border-radius:6px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dlink:hover{color:var(--fg-hi);text-decoration:underline;text-decoration-color:var(--fg-3);text-underline-offset:3px}
.cnt{color:var(--fg-3);font-size:12px;margin-left:4px;flex:none}
.num{font-variant-numeric:tabular-nums;font-size:13px}
.n-new{color:var(--new)} .n-learn{color:var(--learn)} .n-due{color:var(--review)}
.zero{color:var(--zero)}
.deckfoot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}


/* home */
.htop{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:4px 0 20px}
.date{font-size:11px;font-weight:600;color:var(--fg-3)}
.sum{margin:4px 0 0;font-size:17px;color:var(--fg-2)}
.sum .sep{margin:0 10px;color:var(--fg-3)}
.chev.sm{width:24px;height:24px;margin-left:-6px}
.chev.sm svg{width:9px;height:9px}
.topic.is-collapsed{padding-bottom:8px}
.sum b{color:var(--fg);font-weight:700}
.subj{background:linear-gradient(180deg, color-mix(in srgb, var(--sc) 7%, var(--surface)), var(--surface) 140px);border:1px solid color-mix(in srgb, var(--sc) 18%, var(--border));border-radius:12px;padding:16px 18px 14px;margin-bottom:14px}
.shd{display:flex;align-items:center;gap:12px}
.mono{width:42px;height:42px;border-radius:10px;border:0;background:color-mix(in srgb, var(--sc) 24%, transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--sc) 35%, transparent);color:var(--sc);font-weight:700;font-size:17px;display:grid;place-items:center;flex:none;transition:transform .15s}
.mono:hover{background:color-mix(in srgb, var(--sc) 26%, transparent)}
.mono[aria-expanded="false"]{opacity:.7}
.sname{display:flex;flex-direction:column;min-width:0}
.sname .h2{border:0;background:none;padding:0;text-align:left;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--fg)}
.sname .h2:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--fg-3)}
.sname .meta{font-size:12px;color:var(--fg-3)}
.grow{flex:1}
.btn.tint{background:color-mix(in srgb, var(--sc) 16%, transparent);border-color:color-mix(in srgb, var(--sc) 40%, transparent);color:var(--sc);font-weight:600}

.ovcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;border-top:3px solid var(--sc)}
.ovcard h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.ovtiles{display:grid;grid-template-columns:repeat(3,minmax(0,120px));gap:10px}
.ovtiles.two{grid-template-columns:repeat(2,minmax(0,130px))}
.nowrap{white-space:nowrap}
.qcounts .left{color:var(--fg-2)}
.ovtiles div{background:var(--inset);border:1px solid var(--border);border-radius:10px;padding:10px 8px}
.ovtiles b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.ovtiles span{font-size:12px;color:var(--fg-3)}
.ovactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ovdesc{color:var(--fg-3);font-size:13px;max-width:54ch;margin:0}
.shuf{display:inline-flex;align-items:center;gap:9px;padding:7px 10px 7px 12px;border-radius:999px;border:1px solid var(--border-2);background:transparent;color:var(--fg-2);font-size:13px;font-weight:500;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.shuf:hover{border-color:var(--sc,var(--accent));color:var(--fg)}
.shuf .shico svg{width:15px;height:15px;display:block}
.shuf .sw2{width:30px;height:18px;border-radius:999px;background:var(--border-2);position:relative;transition:background .15s}
.shuf .sw2 i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.shuf[aria-pressed="true"]{color:var(--fg);border-color:var(--sc,var(--accent))}
.shuf[aria-pressed="true"] .shico{color:var(--sc,var(--accent))}
.shuf[aria-pressed="true"] .sw2{background:var(--sc,var(--accent))}
.shuf[aria-pressed="true"] .sw2 i{transform:translateX(12px)}
.shuflink{display:inline-flex;align-items:center;gap:5px}
.backbtn{display:inline-flex;align-items:center;gap:6px}
.sm-only{display:none !important}
.backbtn:disabled{opacity:.4;cursor:default}
.done .btn svg{width:14px;height:14px;margin-right:6px;vertical-align:-2px}
.shuflink svg{width:14px;height:14px}
.children{margin-top:16px}
.children h2{font-size:11px;font-weight:600;color:var(--fg-3);margin:0 0 8px 4px}

/* reviewer */
.reviewer{padding-bottom:140px}
.studytop{max-width:860px;margin:0 auto 14px;display:flex;align-items:center;gap:12px}
.studytop .path{color:var(--fg-3);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.studytop .path b{color:var(--fg-2);font-weight:600}
.sbar{max-width:860px;margin:0 auto 16px;height:3px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.sbar span{display:block;height:100%;background:var(--sc,var(--accent));transition:width .3s ease}
.qa{max-width:860px;margin:0 auto;background:var(--qa-bg);color:var(--qa-fg);border:1px solid var(--border);border-radius:12px;padding:26px 30px;font-family:var(--card);font-size:20px;line-height:1.6;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.qa .label{font-family:var(--ui);font-size:12px;font-weight:600;color:var(--fg-3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.qa .label .dot{margin:0}
.qa img{display:block;max-width:100%;height:auto;margin:10px auto;border-radius:6px;cursor:zoom-in}
.qtext,.stext{white-space:pre-wrap;overflow-wrap:anywhere}
.qa hr{border:0;border-top:1px dashed var(--border-2);margin:26px 0 22px}
.answer{animation:reveal .26s cubic-bezier(.2,.7,.2,1) both}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fadein{animation:fade .18s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sect{margin-bottom:16px}
.sect:last-child{margin-bottom:0}
.sect{border-radius:12px;padding:16px 18px}
.sect h3{font-family:var(--ui);font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
.sect.mistake{background:var(--mk-bg);border:1px solid var(--mk-b)}
.sect.mistake h3{color:var(--mistake)}
.sect.mistake .stext{font-family:var(--ui);font-size:16px;font-weight:600;color:var(--mk-fg);line-height:1.5}
.sect.solution{background:var(--so-bg);border:1px solid var(--so-b)}
.sect.solution h3{color:var(--solution)}
.sect.solution .stext{font-size:17px;color:var(--so-fg)}
.sect.solution img{background:#fff;border-radius:10px}
.sect.explain{background:var(--ex-bg);border:1px solid var(--ex-b)}
.sect.explain h3{color:var(--ex-t)}
.sect.explain .stext{font-size:17px;color:var(--ex-fg)}
.sect.explain img{background:#fff;border-radius:10px}
.ktag{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;border:1px solid var(--ex-b);color:var(--ex-t);margin-right:6px;vertical-align:1px}
.kindseg{margin-bottom:2px}
.dialog.kind-learn .mistake-only{display:none}
.sect .muted{color:var(--fg-2)}
.muted{color:var(--fg-3);font-style:italic}
.inline-add{font-family:var(--ui);display:flex;flex-direction:column;gap:8px}
.answerbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.answerbar .inner{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.answerbar .side{display:flex;gap:4px;align-items:center}
.answerbar .side.r{justify-content:flex-end}
.answerbar .mid{display:flex;flex-direction:column;align-items:center;gap:5px}
.qcounts{font-variant-numeric:tabular-nums;font-size:13px;display:flex;gap:6px}
.qcounts .cur{text-decoration:underline;text-underline-offset:3px}
.ease{display:flex;gap:8px}
.ease .col{display:flex;flex-direction:column;align-items:center;gap:4px}
.ease small{font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.ease .btn{min-width:84px;font-weight:600}
.ease .r1{color:var(--again);background:color-mix(in srgb, var(--again) 12%, transparent);border-color:color-mix(in srgb, var(--again) 45%, transparent)}
.ease .r2{color:var(--hard);background:color-mix(in srgb, var(--hard) 12%, transparent);border-color:color-mix(in srgb, var(--hard) 45%, transparent)}
.ease .r3{color:var(--good);background:color-mix(in srgb, var(--good) 12%, transparent);border-color:color-mix(in srgb, var(--good) 45%, transparent)}
.ease .r4{color:var(--easy);background:color-mix(in srgb, var(--easy) 12%, transparent);border-color:color-mix(in srgb, var(--easy) 45%, transparent)}
.ease .r1:hover{background:color-mix(in srgb, var(--again) 20%, transparent)} .ease .r2:hover{background:color-mix(in srgb, var(--hard) 20%, transparent)} .ease .r3:hover{background:color-mix(in srgb, var(--good) 20%, transparent)} .ease .r4:hover{background:color-mix(in srgb, var(--easy) 20%, transparent)}
.showbtn{min-width:240px}
.done{text-align:center;padding:48px 24px;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.done h1{margin:0;font-size:20px;font-weight:700}
.done p{margin:0;color:var(--fg-2);max-width:56ch}

/* browse */
.browser{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}
.sidebar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:66px;align-self:start}
.sideitem{display:flex;align-items:center;width:100%;border:0;background:none;color:var(--fg-2);text-align:left;padding:5px 8px;border-radius:6px;font-size:13px;gap:4px}
.sideitem:hover{background:var(--hover);color:var(--fg)}
.sideitem[aria-current="true"]{background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--fg)}
.sideitem .c{margin-left:auto;color:var(--fg-3);font-variant-numeric:tabular-nums;font-size:12px}
.sideselect{display:none}
.searchrow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.in{background:var(--inset);border:1px solid var(--border-2);border-radius:6px;padding:8px 11px;outline:none;width:100%}
.in:focus{border-color:var(--focus)}
textarea.in{resize:vertical;min-height:72px;line-height:1.45}
.searchrow .in{flex:1;min-width:180px;width:auto}
.tabwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.btable{width:100%;border-collapse:collapse;font-size:13px}
.btable th{text-align:left;font-weight:600;color:var(--fg-3);font-size:11px;padding:9px 10px;border-bottom:1px solid var(--border)}
.btable td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.btable tr:last-child td{border-bottom:0}
.btable tbody tr:hover td{background:var(--surface-2)}
.btable tbody tr{cursor:pointer}
.btable .q{display:flex;gap:10px;align-items:flex-start;min-width:0}
.btable .q img{width:96px;height:60px;object-fit:cover;object-position:top left;border-radius:6px;flex:none;background:#fff}
.btable .qt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.sub{color:var(--fg-3);font-size:12px}

/* stats */
.panel{border:1px solid var(--border);border-radius:12px;padding:18px;background:var(--surface);margin-bottom:14px}
.panel h2{margin:0 0 14px;font-size:14px;font-weight:600}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:140px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--fg-3)}
.bar i{display:block;width:100%;max-width:34px;background:var(--accent);opacity:.7;border-radius:4px 4px 1px 1px;min-height:2px}
.bar b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.hrow{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 40px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}
.hbar{height:8px;background:var(--inset);border-radius:4px;overflow:hidden;display:flex}
.hbar span{height:100%}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
.hrow{grid-template-columns:minmax(0,220px) minmax(0,1fr) 64px}
.hrow b{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}

/* dialogs */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,9,12,.6);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px))}
.dialog{width:100%;max-width:720px;background:var(--surface);border:1px solid var(--border-2);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.dialog header{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--border)}
.dialog header h2{margin:0;font-size:15px;font-weight:600;flex:1}
.updbar{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:min(520px,calc(100% - 36px));background:var(--surface-2);border:1px solid var(--border-2);border-radius:10px;padding:10px 12px 10px 14px;box-shadow:0 14px 36px rgba(0,0,0,.45);font-size:13px}
.updbar span{flex:1;min-width:200px}
.ednav{display:inline-flex;align-items:center;gap:2px;margin-right:4px;font-family:var(--chrome);font-size:12px;color:var(--fg-2)}
.ednav .icon{font-size:15px;line-height:1}
.ednav .icon[disabled]{opacity:.3;pointer-events:none} .ednavn{min-width:54px;text-align:center;font-variant-numeric:tabular-nums}
.edialog:focus{outline:none}
.btable tr.flash td{background:color-mix(in srgb, var(--accent) 16%, transparent);transition:background .3s}
.dialog .body{padding:18px;display:flex;flex-direction:column;gap:14px}
.dialog footer{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.dialog footer .grow{flex:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:12px;color:var(--fg-2);font-weight:600}
.hint{font-size:12px;color:var(--fg-3);font-weight:400}
.row2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.drop{border:1px dashed var(--border-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--inset);outline:none}
.drop.active{border-color:#58628f}
.drop.over{border-color:var(--focus);background:var(--hover)}
.dropcta{display:flex;align-items:center;gap:8px;color:var(--fg-3);font-size:12px;flex-wrap:wrap}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:120px;height:84px;border-radius:6px;overflow:hidden;background:#fff;border:1px solid var(--border)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border:0;border-radius:6px;background:rgba(20,20,20,.85);color:#fff;display:grid;place-items:center;padding:0}
.thumb button svg{width:11px;height:11px}
.thumb.loading{display:grid;place-items:center;color:#555;font-size:12px}
.menu{position:fixed;z-index:40;background:var(--surface-2);border:1px solid var(--border-2);border-radius:10px;box-shadow:0 14px 36px rgba(0,0,0,.5);padding:5px;min-width:210px;animation:fade .1s ease-out}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;font-size:13px}
.menu button:hover{background:color-mix(in srgb, var(--accent) 16%, transparent)}
.menu hr{border:0;border-top:1px solid var(--border-2);margin:4px 0}
.menu .danger{color:color-mix(in srgb, var(--again) 70%, var(--fg))}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(8,9,12,.94);display:grid;place-items:center;padding:56px max(64px,env(safe-area-inset-right,0px)) 40px max(64px,env(safe-area-inset-left,0px));cursor:zoom-out;animation:fade .14s ease-out}
.lightbox figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%;max-height:100%;min-height:0}
.lightbox img{max-width:min(100%,1400px);max-height:calc(100vh - 140px);border-radius:10px;background:#fff;cursor:default;object-fit:contain}
.lightbox figcaption{font-size:13px;color:var(--fg-2);font-weight:600}
.lightbox figcaption span{color:var(--fg-3);font-weight:500;margin-left:8px;font-variant-numeric:tabular-nums}
.lbnav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--border-2);background:rgba(35,39,49,.9);color:var(--fg);font-size:24px;line-height:1;display:grid;place-items:center;padding:0 0 3px;cursor:pointer}
.lbnav:hover{background:var(--hover)}
.lbnav:disabled{opacity:.25;cursor:default}
.lbnav.prev{left:max(12px,env(safe-area-inset-left,0px))}
.lbnav.next{right:max(12px,env(safe-area-inset-right,0px))}
.lbclose{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;border:1px solid var(--border-2);background:rgba(35,39,49,.9);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.lbclose svg{width:14px;height:14px}
.bthumb{border:0;padding:0;background:none;border-radius:6px;flex:none;cursor:zoom-in;line-height:0}
.bthumb:hover img{outline:2px solid var(--accent);outline-offset:1px}
.solink{border:0;background:none;padding:2px 0 0;color:var(--solution);font-size:12px;font-weight:600;cursor:zoom-in;text-align:left}
.solink:hover{text-decoration:underline;text-underline-offset:3px}
.thumb img{cursor:zoom-in}
@media (max-width:760px){ .lightbox{padding:56px 12px 70px} .lbnav{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:none} }
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--surface-2);border:1px solid var(--border-2);border-radius:10px;padding:8px 14px;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.45);max-width:calc(100% - 32px)}
.banner{border:1px solid color-mix(in srgb, var(--hard) 35%, var(--surface));background:color-mix(in srgb, var(--hard) 10%, var(--surface));color:color-mix(in srgb, var(--hard) 35%, var(--fg));border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:16px}
.loading{padding:80px 0;text-align:center;color:var(--fg-3)}
.empty{padding:40px 16px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;gap:10px;align-items:center}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--fg-2)}

body.desktop .hfoot{justify-content:flex-start}

.sidetoggle{display:none}
body.desktop .sidetoggle{display:grid;place-items:center;position:absolute;top:13px;right:12px;z-index:2;width:30px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--fg-3);-webkit-app-region:no-drag;cursor:pointer}
